              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            status:
              enum:
                - in-progress
              type: string
            test:
              $ref: "#/components/schemas/TestMark"
            timeControl:
              $ref: "#/components/schemas/TimeControl"
            toMove:
              enum:
                - x
                - o
              type: string
            tournament:
              $ref: "#/components/schemas/GameTournament"
            unratedByChoice:
              $ref: "#/components/schemas/UnratedByChoice"
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - timeControl
            - status
            - toMove
            - clock
          type: object
        - properties:
            board:
              $ref: "#/components/schemas/GameBoard"
            clock:
              $ref: "#/components/schemas/GameClock"
            gameId:
              type: string
            openingPlies:
              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            reason:
              $ref: "#/components/schemas/FinishReason"
            status:
              enum:
                - finished
              type: string
            test:
              $ref: "#/components/schemas/TestMark"
            timeControl:
              $ref: "#/components/schemas/TimeControl"
            tournament:
              $ref: "#/components/schemas/GameTournament"
            unratedByChoice:
              $ref: "#/components/schemas/UnratedByChoice"
            voided:
              description: "Taken out by the operator: the game stays readable, and counts in no record and no
                rating."
              type: boolean
            winner:
              enum:
                - x
                - o
                - null
              nullable: true
              type: string
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - timeControl
            - status
            - winner
            - reason
            - voided
          type: object
    GameStartEvent:
      description: A game the bot plays has started, or is replayed as the stream opens. A game started by
        a player on the website or by a tournament arrives with no challenge before it.
      properties:
        engine:
          $ref: "#/components/schemas/EngineSession"
        gameId:
          type: string
        level:
          description: The declared level the bot plays this game at, by id; null at its default. A bot that
            no longer declares the level plays its default.
          nullable: true
          pattern: ^[a-z0-9-]{1,16}$
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        opponent:
          $ref: "#/components/schemas/Seat"
        rated:
          description: "Whether this game moves the bot's own rating: true only in a rated game between two
            bots. A game against a player moves only the player's rating, and one against a guest
            moves none. A game between two bots is unrated at a level other than a bot's default, in
            a duel or round robin a person set up on the website, and between two bots of one
            owner."
          type: boolean
        side:
          enum:
            - x
            - o
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        type:
          enum:
            - gameStart
          type: string
      required:
        - type
        - gameId
        - side
        - opponent
        - timeControl
        - openingPlies
        - rated
        - level
        - engine
      type: object
    GameTournament:
      description: "The tournament a game belongs to: its round, and which of its pair's games it is;
        createdBy names who set a person's tournament up."
      properties:
        createdBy:
          type: string
        format:
          $ref: "#/components/schemas/TournamentFormat"
        game:
          description: "Which of its pair's games it is, from 1: each opening twice, the first bot on x and
            then the second."
          maximum: 50
          minimum: 1
          type: integer
        id:
          type: string
        name:
          type: string
        of:
          description: The games its pair plays, 1 for a single game.
          maximum: 50
          minimum: 1
          type: integer
        round:
          minimum: 1
          type: integer
      required:
        - id
        - name
        - format
        - round
        - game
        - of
      type: object
    GameTurn:
      description: One applied turn, numbered from turn 0 at the origin. cells holds its stones in order;
        a turn whose first stone wins holds that stone alone. toMove and clock are the game's state
        once the turn lands.
      properties:
        cells:
          items:
            properties:
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
            type: object
          maxItems: 2
          minItems: 1
          type: array
        clock:
          $ref: "#/components/schemas/GameClock"
        side:
          enum:
            - x
            - o
          type: string
        toMove:
          enum:
            - x
            - o
          type: string
        turn:
          minimum: 1
          type: integer
      required:
        - turn
        - side
        - cells
        - toMove
        - clock
      type: object
    Guest:
      properties:
        kind:
          enum:
            - guest
          type: string
        liveGames:
          $ref: "#/components/schemas/OwnLiveGames"
        name:
          pattern: ^Guest [a-z0-9]{4}$
          type: string
      required:
        - kind
        - name
        - liveGames
      type: object
    GuestLimitError:
      properties:
        code:
          enum:
            - guest_limit
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    InGameError:
      properties:
        code:
          enum:
            - in_game
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    InLiveGameError:
      properties:
        code:
          enum:
            - in_live_game
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    LeaderboardBot:
      description: A bot carries its owner and presence as the bot list has them.
      properties:
        games:
          minimum: 1
          type: integer
        kind:
          enum:
            - bot
          type: string
        lastPlayedAt:
          format: date-time
          type: string
        name:
          type: string
        online:
          type: boolean
        ownerName:
          nullable: true
          type: string
        rank:
          minimum: 1
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - rank
        - name
        - rating
        - games
        - lastPlayedAt
        - kind
        - ownerName
        - online
      type: object
    LeaderboardEntry:
      description: rank is the position on the filtered board, games the rated games the player has
        played, and lastPlayedAt when the latest of them finished.
      discriminator:
        mapping:
          bot: "#/components/schemas/LeaderboardBot"
          human: "#/components/schemas/LeaderboardHuman"
        propertyName: kind
      oneOf:
        - $ref: "#/components/schemas/LeaderboardBot"
        - $ref: "#/components/schemas/LeaderboardHuman"
    LeaderboardHuman:
      properties:
        games:
          minimum: 1
          type: integer
        kind:
          enum:
            - human
          type: string
        lastPlayedAt:
          format: date-time
          type: string
        name:
          type: string
        rank:
          minimum: 1
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - rank
        - name
        - rating
        - games
        - lastPlayedAt
        - kind
      type: object
    Level:
      additionalProperties: false
      properties:
        about:
          description: At most 120 characters once cleaned.
          type: string
        budget:
          $ref: "#/components/schemas/LevelBudget"
        id:
          $ref: "#/components/schemas/LevelId"
        label:
          description: The name a player picks the level by, 24 printable ASCII characters at most, starting
            and ending on a visible one.
          pattern: ^[!-~](?:[ -~]{0,22}[!-~])?$
          type: string
        note:
          description: Anything about the level the budget keys cannot say, at most 80 characters once cleaned.
          type: string
      required:
        - id
        - label
      type: object
    LevelBudget:
      additionalProperties: false
      description: What a level spends per turn, as the bot states it, for display only; at least one key.
      minProperties: 1
      properties:
        depthTurns:
          description: Search depth in HeXO turns, not stones.
          maximum: 64
          minimum: 1
          type: integer
        nodes:
          description: Search nodes per turn.
          maximum: 1000000000000
          minimum: 1
          type: integer
        playouts:
          description: Simulations or visits per turn.
          maximum: 1000000000
          minimum: 1
          type: integer
        timeMs:
          description: Think time per turn, in milliseconds.
          maximum: 600000
          minimum: 1
          type: integer
      type: object
    LevelId:
      description: "A level's id: lowercase letters, digits, and hyphens, unique in the bot's list."
      pattern: ^[a-z0-9-]{1,16}$
      type: string
    Levels:
      additionalProperties: false
      description: The strengths a player on the website may pick, 2 to 8, weakest first, each id unique;
        default names one of them. A game at any level but the default is unrated for both sides.
        Null until the bot declares levels, and once it clears them.
      nullable: true
      properties:
        default:
          description: "The level the bot plays unless a player picks another: the one its rating belongs to."
          pattern: ^[a-z0-9-]{1,16}$
          type: string
        list:
          description: Weakest first.
          items:
            $ref: "#/components/schemas/Level"
          maxItems: 8
          minItems: 2
          type: array
      required:
        - default
        - list
      type: object
    LiveGameEntry:
      description: A game in progress, its board and clock as its snapshot states them; a game with a
        guest seat, a bot at a level other than its default, or one its snapshot marks
        unratedByChoice, is unrated.
      properties:
        cells:
          description: Every stone in ply order, the opening included.
          items:
            properties:
              side:
                enum:
                  - x
                  - o
                type: string
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
              - side
            type: object
          minItems: 1
          type: array
        clock:
          $ref: "#/components/schemas/GameClock"
        gameId:
          type: string
        players:
          $ref: "#/components/schemas/GamePlayers"
        rated:
          type: boolean
        test:
          $ref: "#/components/schemas/TestMark"
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        toMove:
          enum:
            - x
            - o
          type: string
        tournament:
          $ref: "#/components/schemas/GameTournament"
      required:
        - gameId
        - players
        - timeControl
        - toMove
        - rated
        - cells
        - clock
      type: object
    MeUpdate:
      additionalProperties: false
      properties:
        analysisOptOut:
          description: True deletes the community readings of every game the user played and hides the bots'
            own views of them; false lets new requests in.
          type: boolean
      type: object
    MoveError:
      properties:
        code:
          enum:
            - bad_request
            - not_your_turn
            - cell_occupied
            - out_of_range
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    MoveRequest:
      properties:
        board:
          $ref: "#/components/schemas/Board"
        request_id:
          minimum: 0
          type: integer
        time_limit:
          minimum: 0
          type: number
      required:
        - board
      type: object
    MoveRequestEvent:
      deprecated: true
      description: "Deprecated, and sent until the API's 1.0.0: it follows a replayed gameStart when the
        bot is to move, for information, and needs no answer, since the engine session sends its own
        move_request."
      properties:
        gameId:
          type: string
        request:
          $ref: "#/components/schemas/MoveRequest"
        type:
          enum:
            - moveRequest
          type: string
      required:
        - type
        - gameId
        - request
      type: object
    NameMismatchError:
      properties:
        code:
          enum:
            - bad_request
            - name_mismatch
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    NameTakenError:
      properties:
        code:
          enum:
            - name_taken
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    NextPath:
      description: A path on this site, with its query, where a sign-in returns.
      maxLength: 256
      pattern: ^\/[A-Za-z0-9\-._~!$&'()*+,;=:@%/?]*$
      type: string
    NotFoundError:
      properties:
        code:
          enum:
            - not_found
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Ok:
      properties:
        ok:
          enum:
            - true
          type: boolean
      required:
        - ok
      type: object
    OpeningPlies:
      description: Stones the server places before either player acts, the origin at (0, 0) included. A
        ply is one stone; turn 0 is the origin, and turn t >= 1 is plies 2t-1 and 2t. Each later ply
        lands on an empty cell drawn uniformly from those within hex distance 2 of the origin. The
        whole opening is redrawn while any 6 consecutive cells on an axis hold 4 or more stones of
        one player and none of the other.
      enum:
        - 1
        - 3
        - 5
        - 7
        - 9
      type: integer
    OwnAnalysis:
      description: What a bot said of its own moves while it played, with the values its analyzer
        declaration held at its first evaluation of the game; a bot judging itself is no judgment.
      properties:
        kind:
          enum:
            - own
          type: string
        player:
          description: The bot's name as the game shows it.
          type: string
        side:
          enum:
            - x
            - o
          type: string
        turns:
          description: "Each turn the bot evaluated: its move first, then up to 2 considerations."
          items:
            $ref: "#/components/schemas/AnalysisTurn"
          type: array
        values:
          $ref: "#/components/schemas/AnalyzerValues"
      required:
        - kind
        - side
        - player
        - values
        - turns
      type: object
    OwnLiveGames:
      description: The person's live games, newest first.
      items:
        $ref: "#/components/schemas/LiveGameEntry"
      maxItems: 3
      type: array
    PausedError:
      properties:
        code:
          enum:
            - paused
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PayloadTooLargeError:
      properties:
        code:
          enum:
            - payload_too_large
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Player:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - name
        - rating
        - provisional
      type: object
    PlayerRecord:
      description: Every finished game the player sat in counts, aborted and voided games aside, and a
        bot's games against guests apart.
      properties:
        asO:
          properties:
            games:
              minimum: 0
              type: integer
            won:
              minimum: 0
              type: integer
          required:
            - games
            - won
          type: object
        asX:
          properties:
            games:
              minimum: 0
              type: integer
            won:
              minimum: 0
              type: integer
          required:
            - games
            - won
          type: object
        deviation:
          description: The rating's deviation as the player's last rated game left it, rounded; the rating is
            likely within this many points.
          minimum: 0
          type: integer
        firstGameAt:
          format: date-time
          nullable: true
          type: string
        forfeits:
          description: Games lost by a stream that stayed closed, and by an illegal move.
          properties:
            disconnect:
              minimum: 0
              type: integer
            terminated:
              minimum: 0
              type: integer
          required:
            - disconnect
            - terminated
          type: object
        games:
          minimum: 0
          type: integer
        guests:
          description: A bot's games against guests, unrated and counted in no other figure here.
          properties:
            games:
              minimum: 0
              type: integer
            lost:
              minimum: 0
              type: integer
            won:
              minimum: 0
              type: integer
          required:
            - games
            - won
            - lost
          type: object
        kind:
          enum:
            - bot
            - human
          type: string
        lastGameAt:
          format: date-time
          nullable: true
          type: string
        lost:
          minimum: 0
          type: integer
        name:
          type: string
        opponents:
          description: The opponents met most, with the player's wins and losses against each.
          items:
            properties:
              deleted:
                $ref: "#/components/schemas/Deleted"
              games:
                minimum: 0
                type: integer
              kind:
                enum:
                  - bot
                  - human
                type: string
              lost:
                minimum: 0
                type: integer
              name:
                type: string
              won:
                minimum: 0
                type: integer
            required:
              - name
              - kind
              - games
              - won
              - lost
            type: object
          maxItems: 5
          type: array
        placings:
          description: A bot's finished tournaments, newest first, with its place in each.
          items:
            properties:
              endedAt:
                format: date-time
                type: string
              entrants:
                minimum: 0
                type: integer
              name:
                type: string
              points:
                minimum: 0
                type: integer
              rank:
                minimum: 1
                type: integer
              tournamentId:
                type: string
            required:
              - tournamentId
              - name
              - rank
              - entrants
              - points
              - endedAt
            type: object
          maxItems: 10
          type: array
        provisional:
          $ref: "#/components/schemas/Provisional"
        rank:
          description: The place on the ladder of the last 30 days, or null off it.
          minimum: 1
          nullable: true
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
        undecided:
          description: Games that reached a cap with no winner.
          minimum: 0
          type: integer
        won:
          minimum: 0
          type: integer
      required:
        - name
        - kind
        - rating
        - deviation
        - provisional
        - rank
        - games
        - won
        - lost
        - undecided
        - asX
        - asO
        - forfeits
        - opponents
        - firstGameAt
        - lastGameAt
      type: object
    PositionCheck:
      properties:
        cells:
          $ref: "#/components/schemas/AnalysisCells"
        toMove:
          enum:
            - x
            - o
          type: string
      required:
        - cells
        - toMove
      type: object
    PositionCheckError:
      properties:
        code:
          enum:
            - live_position
            - seated
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PositionReading:
      description: "queued: the request was held 10 s without an answer; posting the same position again
        waits on the same request, and analyzer names the one it waits for once one is chosen. A
        failed reading costs nothing; left counts the positions the caller may still have read this
        UTC day."
      oneOf:
        - properties:
            analyzer:
              $ref: "#/components/schemas/AnalyzerRef"
            cached:
              description: True for a reading kept from an earlier request, which costs nothing.
              type: boolean
            elapsedMs:
              description: How long it took to answer.
              minimum: 0
              type: integer
            left:
              maximum: 300
              minimum: 0
              type: integer
            lines:
              description: Best first.
              items:
                $ref: "#/components/schemas/AnalysisLine"
              maxItems: 3
              minItems: 1
              type: array
            readAt:
              format: date-time
              type: string
            seconds:
              description: The seconds the analyzer was given.
              maximum: 10
              minimum: 1
              type: integer
            status:
              enum:
                - done
              type: string
          required:
            - status
            - analyzer
            - seconds
            - elapsedMs
            - readAt
            - cached
            - lines
            - left
          type: object
        - properties:
            ahead:
              description: Positions the analyzer reads before this one.
              minimum: 0
              type: integer
            analyzer:
              $ref: "#/components/schemas/AnalyzerRef"
            left:
              maximum: 300
              minimum: 0
              type: integer
            status:
              enum:
                - queued
              type: string
          required:
            - status
            - ahead
            - left
          type: object
        - properties:
            analyzer:
              $ref: "#/components/schemas/AnalyzerRef"
            failure:
              $ref: "#/components/schemas/AnalysisFailure"
            left:
              maximum: 300
              minimum: 0
              type: integer
            status:
              enum:
                - failed
              type: string
          required:
            - status
            - analyzer
            - failure
            - left
          type: object
    PositionReadingConflictError:
      properties:
        code:
          enum:
            - live_position
            - seated
            - no_analyzer
            - superseded
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PositionReadingQuotaError:
      properties:
        code:
          enum:
            - analysis_limit
            - analysis_busy
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PositionReadingRequest:
      properties:
        analyzer:
          description: The analyzer to ask, by name; null for any ready one.
          nullable: true
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
          type: string
        cells:
          $ref: "#/components/schemas/AnalysisCells"
        lines:
          description: Lines to read; an analyzer declaring fewer answers its own number.
          maximum: 3
          minimum: 1
          type: integer
        seconds:
          description: Seconds to read for; an analyzer declaring fewer reads for its own most.
          enum:
            - 1
            - 2
            - 5
          type: integer
        toMove:
          enum:
            - x
            - o
          type: string
      required:
        - cells
        - toMove
        - analyzer
        - lines
        - seconds
      type: object
    Provisional:
      description: True while the rating deviation is above 75.
      type: boolean
    RateLimitedError:
      properties:
        code:
          enum:
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Rating:
      description: The Glicko-2 rating, rounded to a whole point.
      type: integer
    RatingHistory:
      description: Oldest first.
      items:
        $ref: "#/components/schemas/RatingPoint"
      maxItems: 500
      type: array
    RatingPoint:
      description: The rating and its deviation after one rated game.
      properties:
        at:
          format: date-time
          type: string
        deviation:
          minimum: 0
          type: integer
        gameId:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - gameId
        - at
        - rating
        - deviation
        - provisional
      type: object
    ReportReason:
      description: "illegal: content against the law. abuse: harassment, hate, or threats. name: a name or
        text that is offensive, misleading, or impersonates someone. cheating: unfair play, or one
        person behind several accounts. other: anything else."
      enum:
        - illegal
        - abuse
        - name
        - cheating
        - other
      type: string
    ReportReceipt:
      properties:
        id:
          description: The report's number, for writing to the operator about it.
          minimum: 1
          type: integer
      required:
        - id
      type: object
    ReportRequest:
      additionalProperties: false
      properties:
        details:
          description: What is wrong and why.
          maxLength: 2000
          minLength: 1
          type: string
        email:
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+$
          type: string
        goodFaith:
          description: The reporter states that the report is accurate and made in good faith.
          enum:
            - true
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        reason:
          $ref: "#/components/schemas/ReportReason"
        subject:
          description: "The page the report is about: a path on this site, with its query."
          maxLength: 512
          pattern: ^\/[A-Za-z0-9\-._~!$&'()*+,;=:@%/?]*$
          type: string
      required:
        - subject
        - reason
        - details
        - goodFaith
