components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        minimum: 1
        type: integer
  parameters:
    BotName:
      description: The bot's name.
      in: path
      name: name
      required: true
      schema:
        type: string
    ChallengeId:
      description: The challenge, as carried on its challenge line.
      in: path
      name: challengeId
      required: true
      schema:
        type: string
    GameId:
      description: The game, as carried on gameStart and moveRequest.
      in: path
      name: gameId
      required: true
      schema:
        type: string
    PlayerName:
      description: "A player's name, matched case-folded: a bot or a human."
      in: path
      name: name
      required: true
      schema:
        type: string
    TournamentId:
      description: "The tournament's id: t_, or d_ for a duel kept from the duels of old."
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    ArchiveLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: A finished game is read at most 10 at once, then 1 a second per client, and 20 at once,
        then 10 a second across callers (rate_limited); or too many requests. Retry after
        Retry-After.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
      description: The request fails validation.
    Banned:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannedError"
      description: The bot's owner is banned; after the ban lifts, the owner must rotate the token.
    BotUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: Missing, unknown, or rotated bot token.
    ExportLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: Exports are downloaded at most 4 at once, then 1 every 15 s per client, and 20 at once,
        then 1 a second across callers (rate_limited); or too many requests. Retry after
        Retry-After.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    GameCreateForbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameCreateForbiddenError"
      description: "The bot is delisted and takes no new games (delisted). own_bot is no longer sent: a
        game against the caller's own bot is played unrated."
    GameExport:
      content:
        application/zip:
          schema:
            format: binary
            type: string
      description: "A zip archive, stored without compression: one HTTTX v1 file per finished game,
        numbered in play order and named for its sides (01-x-vs-o.htttx), and games.csv, a row per
        game. Each file carries the HTTTX v1 header (name, platform, utcdatetime as the game's
        start, playercross, playercircle, timecontrol for a match clock, endreason and winner where
        v1 defines them), then the turns from the origin, the opening's stones among them."
      headers:
        Content-Disposition:
          description: An attachment with a plain ASCII file name.
          schema:
            type: string
    GameOver:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameOverError"
      description: The game is already finished (game_over).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
      description: The target does not exist or is not the caller's to act on.
    Paused:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PausedError"
      description: "The site is paused: no new stream, challenge, or game starts, and open streams and
        live games continue. A bot with a live game, or playing the running weekly tournament, still
        opens its stream. Retry after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayloadTooLargeError"
      description: The body is larger than 16 KiB (payload_too_large).
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: "Too many requests (rate_limited): one client, by network address, makes 60 at once,
        then 10 a second; operations needing no credential take 300 at once, then 100 a second from
        all callers together; each bot, user, guest, or game seat makes 20 at once, then 2 a second
        with its credential, and an account changes its bots 10 at once, then 1 a minute. Retry
        after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    SignedInUser:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: "No signed-in user: a guest, or no session at all."
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: No session cookie, or the session is expired or unknown.
  schemas:
    Accepts:
      description: The clocks the bot plays; a bot that never declared accepts plays none.
      nullable: true
      properties:
        match:
          description: True to play any match clock.
          type: boolean
        turnMs:
          description: The turn clocks the bot plays, as the inclusive [min, max] of turnTimeMs; null refuses
            turn clocks.
          items:
            type: integer
          maxItems: 2
          minItems: 2
          nullable: true
          type: array
        unlimited:
          description: True to play games with no clock.
          type: boolean
      required:
        - turnMs
        - match
        - unlimited
      type: object
    Account:
      description: levels and analyzer are null until the bot declares them.
      properties:
        about:
          description: The owner's text from the website, which the bot's pages show; else the declared one.
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        analyzer:
          $ref: "#/components/schemas/Analyzer"
        levels:
          $ref: "#/components/schemas/Levels"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          description: The owner's link from the website, which the bot's pages show; else the declared one.
        version:
          maxLength: 64
          type: string
      required:
        - name
        - rating
        - provisional
        - levels
        - analyzer
      type: object
    AccountDeclaration:
      additionalProperties: false
      description: "Text is cleaned, never refused for what it holds: a line break or tab becomes a space,
        other control and format characters (bidirectional marks, zero-width characters, soft
        hyphens) are dropped, whitespace runs collapse, and the ends are trimmed. A level's about
        and note are cleaned the same way."
      properties:
        about:
          deprecated: true
          description: "Deprecated: the owner sets the bot's text on the website, which takes this one's
            place. At most 280 characters once cleaned; empty clears it."
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        analyzer:
          $ref: "#/components/schemas/AnalyzerDeclaration"
        levels:
          $ref: "#/components/schemas/Levels"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          deprecated: true
          description: "Deprecated: the owner sets the bot's link on the website, which takes this one's
            place. Empty clears it."
        version:
          description: At most 64 characters once cleaned; empty clears it.
          type: string
      type: object
    AccountExport:
      description: "Every row tied to the account: names of other players read as the site shows them.
        Never a token, a token's hash, or a sign-in's state."
      properties:
        account:
          properties:
            analysisOptOut:
              type: boolean
            bannedAt:
              format: date-time
              nullable: true
              type: string
            createdAt:
              format: date-time
              type: string
            discordId:
              type: string
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
            - discordId
            - createdAt
            - bannedAt
            - analysisOptOut
          type: object
        analyses:
          description: Whole-game readings the account asked for.
          items:
            properties:
              gameId:
                type: string
              id:
                type: string
              requestedAt:
                format: date-time
                type: string
              status:
                $ref: "#/components/schemas/AnalysisStatus"
            required:
              - id
              - gameId
              - status
              - requestedAt
            type: object
          type: array
        bots:
          items:
            properties:
              about:
                nullable: true
                type: string
              accepts:
                $ref: "#/components/schemas/Accepts"
              analyzer:
                nullable: true
                properties:
                  lines:
                    type: integer
                  maxSeconds:
                    type: integer
                  values:
                    $ref: "#/components/schemas/AnalyzerValues"
                  whilePlaying:
                    type: boolean
                required:
                  - maxSeconds
                  - lines
                  - whilePlaying
                  - values
                type: object
              client:
                $ref: "#/components/schemas/BotClient"
              createdAt:
                format: date-time
                type: string
              deletedAt:
                format: date-time
                nullable: true
                type: string
              delistedAt:
                format: date-time
                nullable: true
                type: string
              id:
                type: string
              levels:
                $ref: "#/components/schemas/Levels"
              name:
                type: string
              ownerAbout:
                description: The owner's text from the website; about and repoUrl are as the bot declared them.
                nullable: true
                type: string
              ownerRepoUrl:
                nullable: true
                type: string
              rating:
                $ref: "#/components/schemas/ExportedRating"
              repoUrl:
                nullable: true
                type: string
              version:
                nullable: true
                type: string
            required:
              - id
              - name
              - createdAt
              - about
              - version
              - repoUrl
              - ownerAbout
              - ownerRepoUrl
              - client
              - accepts
              - levels
              - analyzer
              - delistedAt
              - deletedAt
              - rating
            type: object
          type: array
        challenges:
          items:
            properties:
              challenged:
                type: string
              challenger:
                type: string
              createdAt:
                format: date-time
                type: string
              decidedAt:
                format: date-time
                nullable: true
                type: string
              firstPlayer:
                enum:
                  - challenger
                  - challenged
                  - random
                type: string
              gameId:
                nullable: true
                type: string
              id:
                type: string
              openingPlies:
                $ref: "#/components/schemas/OpeningPlies"
              status:
                enum:
                  - created
                  - accepted
                  - declined
                  - canceled
                  - expired
                type: string
              timeControl:
                $ref: "#/components/schemas/TimeControl"
            required:
              - id
              - challenger
              - challenged
              - timeControl
              - openingPlies
              - firstPlayer
              - status
              - gameId
              - createdAt
              - decidedAt
            type: object
          type: array
        exportedAt:
          format: date-time
          type: string
        games:
          items:
            properties:
              createdAt:
                format: date-time
                type: string
              finishedAt:
                format: date-time
                nullable: true
                type: string
              id:
                type: string
              moves:
                items:
                  properties:
                    at:
                      format: date-time
                      type: string
                    cells:
                      items:
                        properties:
                          x:
                            type: integer
                          y:
                            type: integer
                        required:
                          - x
                          - y
                        type: object
                      type: array
                    side:
                      enum:
                        - x
                        - o
                      type: string
                  required:
                    - side
                    - cells
                    - at
                  type: object
                type: array
              opening:
                items:
                  properties:
                    side:
                      enum:
                        - x
                        - o
                      type: string
                    x:
                      type: integer
                    y:
                      type: integer
                  required:
                    - x
                    - y
                    - side
                  type: object
                type: array
              openingPlies:
                $ref: "#/components/schemas/OpeningPlies"
              players:
                properties:
                  o:
                    $ref: "#/components/schemas/ExportedSeat"
                  x:
                    $ref: "#/components/schemas/ExportedSeat"
                required:
                  - x
                  - o
                type: object
              ratings:
                items:
                  properties:
                    after:
                      type: number
                    before:
                      type: number
                    deviationAfter:
                      type: number
                    side:
                      enum:
                        - x
                        - o
                      type: string
                  required:
                    - side
                    - before
                    - after
                    - deviationAfter
                  type: object
                type: array
              reason:
                $ref: "#/components/schemas/FinishReason"
              timeControl:
                $ref: "#/components/schemas/TimeControl"
              unratedByChoice:
                $ref: "#/components/schemas/UnratedByChoice"
              voided:
                type: boolean
              winner:
                enum:
                  - x
                  - o
                  - null
                nullable: true
                type: string
            required:
              - id
              - players
              - timeControl
              - openingPlies
              - opening
              - moves
              - winner
              - reason
              - createdAt
              - finishedAt
              - voided
              - ratings
            type: object
          type: array
        moderation:
          items:
            properties:
              action:
                type: string
              at:
                format: date-time
                type: string
              reason:
                type: string
              target:
                nullable: true
                type: string
            required:
              - action
              - target
              - reason
              - at
            type: object
          type: array
        rating:
          description: Null until a rated game.
          nullable: true
          properties:
            deviation:
              type: number
            rating:
              type: number
            volatility:
              type: number
          required:
            - rating
            - deviation
            - volatility
          type: object
        sessions:
          items:
            properties:
              createdAt:
                format: date-time
                type: string
              discordDisplayName:
                nullable: true
                type: string
              discordUsername:
                nullable: true
                type: string
              expiresAt:
                format: date-time
                type: string
            required:
              - createdAt
              - expiresAt
              - discordUsername
              - discordDisplayName
            type: object
          type: array
        tournamentEntries:
          items:
            properties:
              bot:
                type: string
              enteredAt:
                format: date-time
                type: string
              ratingAtStart:
                nullable: true
                type: number
              reason:
                enum:
                  - daily_cap
                  - clock
                  - missed
                  - banned
                  - delisted
                  - deleted
                  - owner
                  - refused
                  - tournament
                  - null
                nullable: true
                type: string
              state:
                enum:
                  - entered
                  - playing
                  - absent
                  - left_out
                  - withdrawn
                type: string
              tournament:
                type: string
              tournamentId:
                type: string
            required:
              - tournamentId
              - tournament
              - bot
              - state
              - reason
              - ratingAtStart
              - enteredAt
            type: object
          type: array
        tournaments:
          description: Duels and round robins the account set up, tests among them, each bot in the order it
            named them.
          items:
            properties:
              bots:
                items:
                  type: string
                type: array
              createdAt:
                format: date-time
                type: string
              endedAt:
                format: date-time
                nullable: true
                type: string
              format:
                $ref: "#/components/schemas/TournamentFormat"
              gamesPerPair:
                $ref: "#/components/schemas/TournamentGamesPerPair"
              id:
                type: string
              rated:
                type: boolean
              status:
                enum:
                  - scheduled
                  - running
                  - finished
                  - called_off
                  - canceled
                  - stopped
                  - cut_short
                type: string
              test:
                type: boolean
            required:
              - id
              - format
              - bots
              - gamesPerPair
              - test
              - rated
              - status
              - createdAt
              - endedAt
            type: object
          type: array
      required:
        - exportedAt
        - account
        - sessions
        - rating
        - bots
        - games
        - tournamentEntries
        - tournaments
        - challenges
        - analyses
        - moderation
      type: object
    Analysis:
      discriminator:
        mapping:
          community: "#/components/schemas/CommunityAnalysis"
          own: "#/components/schemas/OwnAnalysis"
        propertyName: kind
      oneOf:
        - $ref: "#/components/schemas/CommunityAnalysis"
        - $ref: "#/components/schemas/OwnAnalysis"
    AnalysisCells:
      description: A position's stones with their sides, in any order, 401 at most, each x and y within
        4096 of the origin; one stone a cell, and no six on the board.
      items:
        properties:
          side:
            enum:
              - x
              - o
            type: string
          x:
            type: integer
          y:
            type: integer
        required:
          - x
          - y
          - side
        type: object
      maxItems: 401
      minItems: 1
      type: array
    AnalysisFailure:
      description: "Why a reading failed: no answer within its seconds and a grace (timeout); a line that
        is not a legal turn, or repeats one (illegal); a move without an evaluation (no_evaluation);
        an evaluation out of bounds or contradicting the board (inconsistent); the analyzer hung up
        (disconnect) or broke the session's protocol (protocol); no analyzer took the request in
        time (expired)."
      enum:
        - timeout
        - illegal
        - no_evaluation
        - inconsistent
        - disconnect
        - protocol
        - expired
      type: string
    AnalysisLeft:
      description: "What the user may still ask of analyzers this UTC day: positions read, and whole games
        requested."
      properties:
        games:
          maximum: 10
          minimum: 0
          type: integer
        positions:
          maximum: 300
          minimum: 0
          type: integer
      required:
        - positions
        - games
      type: object
    AnalysisLine:
      description: A turn and the evaluation of the board after it, x-positive; heuristic, winIn, or both.
      properties:
        cells:
          description: The turn's two stones in order; when the first completes six, the second is never played.
          items:
            properties:
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
            type: object
          maxItems: 2
          minItems: 2
          type: array
        heuristic:
          description: The analyzer's heuristic, positive for x, on a scale of about -1 to 1.
          maximum: 1000000
          minimum: -1000000
          type: number
        winIn:
          description: Turns to a forced win, the side to move's turn counted first, positive when x wins;
            never zero.
          maximum: 1000
          minimum: -1000
          type: integer
      required:
        - cells
      type: object
    AnalysisList:
      properties:
        analyses:
          description: Community readings, finished first, then queued or running, then the latest failed one;
            then each bot seat's own.
          items:
            $ref: "#/components/schemas/Analysis"
          maxItems: 6
          type: array
        independentOnline:
          description: True while an analyzer whose owner played in neither seat is online and may read the
            game now; a request naming no analyzer goes to such an analyzer first.
          type: boolean
        optedOut:
          description: True when a player asked that their games stay out of public analysis; the list is then
            empty.
          type: boolean
      required:
        - analyses
        - optedOut
        - independentOnline
      type: object
    AnalysisListConflictError:
      properties:
        code:
          enum:
            - game_live
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    AnalysisRequest:
      properties:
        analyzer:
          description: The analyzer to ask, by name; when absent, any eligible one, preferring one whose owner
            played in neither seat while such an analyzer is online.
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
          type: string
      type: object
    AnalysisRequestConflictError:
      properties:
        code:
          enum:
            - analysis_pending
            - analysis_full
            - pending_limit
            - not_analysable
            - no_analyzer
            - opted_out
            - game_live
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    AnalysisRequestQuotaError:
      properties:
        code:
          enum:
            - analysis_limit
            - analysis_queue_full
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    AnalysisSession:
      properties:
        socketUrl:
          description: The analysis session's path on the API's origin, dialed as a game's engine session is.
          type: string
        token:
          description: "The analysis token (has_...): it opens the bot's analysis session until 60 s after the
            line that carried it; a later analysisSession line replaces it."
          type: string
      required:
        - socketUrl
        - token
      type: object
    AnalysisSessionEvent:
      description: "Sent only to a bot that declares an analyzer: as the stream opens, after a declaration
        turns it on, and 5 s after its analysis session closes while the stream stays open."
      properties:
        engine:
          $ref: "#/components/schemas/AnalysisSession"
        type:
          enum:
            - analysisSession
          type: string
      required:
        - type
        - engine
      type: object
    AnalysisStatus:
      enum:
        - queued
        - running
        - done
        - failed
      type: string
    AnalysisTurn:
      properties:
        lines:
          items:
            $ref: "#/components/schemas/AnalysisLine"
          maxItems: 3
          minItems: 1
          type: array
        toMove:
          enum:
            - x
            - o
          type: string
        turn:
          description: The turn played from the position; one past the last turn reads the final board.
          maximum: 501
          minimum: 1
          type: integer
      required:
        - turn
        - toMove
        - lines
      type: object
    Analyzer:
      description: The analyzer the bot declared; null until it declares one, and once it withdraws.
      nullable: true
      properties:
        lines:
          maximum: 3
          minimum: 1
          type: integer
        maxSeconds:
          maximum: 10
          minimum: 1
          type: integer
        ready:
          description: True while the bot holds its analysis session open.
          type: boolean
        values:
          $ref: "#/components/schemas/AnalyzerValues"
        whilePlaying:
          type: boolean
      required:
        - maxSeconds
        - lines
        - whilePlaying
        - values
        - ready
      type: object
    AnalyzerDeclaration:
      additionalProperties: false
      description: Opts the bot in to reading positions sent on its analysis session, from the website's
        analysis board and from finished games. Declaring it promises the htttx basic_websocket
        capabilities free_setup, resettable_state, dual_sided, request_id, move_time_limit, and
        interruptible.
      nullable: true
      properties:
        lines:
          description: "Lines the bot answers per position: its move, then up to two considerations, each with
            an evaluation."
          maximum: 3
          minimum: 1
          type: integer
        maxSeconds:
          default: 2
          description: The most seconds the bot reads one position for; a person picks up to it. 2 when absent.
          maximum: 10
          minimum: 1
          type: integer
        values:
          $ref: "#/components/schemas/AnalyzerValuesDeclaration"
        whilePlaying:
          default: false
          description: True to take positions while the bot plays a game; false, the default, takes them only
            between games.
          type: boolean
      required:
        - lines
      type: object
    AnalyzerRef:
      description: A community bot whose reading this is, with the values it declared when it read; no
        analyzer is official.
      properties:
        name:
          type: string
        ownerName:
          description: Null once the owner's account is deleted.
          nullable: true
          type: string
        values:
          $ref: "#/components/schemas/AnalyzerValues"
        version:
          description: The version the bot declared when it read; null if none.
          nullable: true
          type: string
      required:
        - name
        - version
        - ownerName
        - values
      type: object
    AnalyzerValues:
      description: "How the analyzer's heuristic reads: scale 1, null cuts, which judge no drop of value,
        and raw, unless it declared otherwise."
      properties:
        cuts:
          $ref: "#/components/schemas/ValueCuts"
        meaning:
          $ref: "#/components/schemas/ValueMeaning"
        scale:
          exclusiveMinimum: true
          maximum: 1000000
          minimum: 0
          type: number
      required:
        - scale
        - cuts
        - meaning
      type: object
    AnalyzerValuesDeclaration:
      additionalProperties: false
      description: How the bot's heuristic reads. Absent, the heuristic reads as raw at scale 1 and no
        drop of value is judged; forced wins are judged either way.
      properties:
        cuts:
          additionalProperties: false
          description: "The drops of the mover's value, on the scaled range, the site judges a turn by: each
            above 0 and at most 2, rising from inaccuracy to blunder; 0.1, 0.2, and 0.3 suit
            expected values. Absent, it judges no drop of value."
          properties:
            blunder:
              exclusiveMinimum: true
              maximum: 2
              minimum: 0
              type: number
            inaccuracy:
              exclusiveMinimum: true
              maximum: 2
              minimum: 0
              type: number
            mistake:
              exclusiveMinimum: true
              maximum: 2
              minimum: 0
              type: number
          required:
            - inaccuracy
            - mistake
            - blunder
          type: object
        meaning:
          default: raw
          description: "expected: the heuristic, divided by scale, is the bot's estimate of x's expected
            result, 2 P(x wins) - 1. raw, the default: it is only ordered, higher being better for
            x, and not calibrated."
          enum:
            - expected
            - raw
          type: string
        scale:
          default: 1
          description: The heuristic size the bot means as decided; the site divides heuristics by it before
            drawing or judging them. 1 when absent.
          exclusiveMinimum: true
          maximum: 1000000
          minimum: 0
          type: number
      type: object
    BadRequestError:
