        acceptance of the clock; every condition answers with a distinct code so a caller knows what
        to change. The caller is a signed-in user or a guest session, bounded either way: at most
        three live games at once (human_busy) and sixty seconds between creations (game_cooldown). A
        game against a guest is unrated for both sides. Colours are drawn at creation, the server
        places the origin stone and the opening turns itself, and the bot receives its
        engine-session handoff as a gameStart line on its stream."
