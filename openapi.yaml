components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        minimum: 1
        type: integer
  parameters:
    BotName:
      description: The bot's name.
      in: path
      name: name
      required: true
      schema:
        type: string
    ChallengeId:
      description: The challenge, as carried on its challenge line.
      in: path
      name: challengeId
      required: true
      schema:
        type: string
    GameId:
      description: The game, as carried on gameStart and moveRequest.
      in: path
      name: gameId
      required: true
      schema:
        type: string
  responses:
    ArchiveLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: A finished game is read at most 10 at once, then 1 a second per client, and 20 at once,
        then 10 a second across callers (rate_limited); or too many requests. Retry after
        Retry-After.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
      description: The request fails validation.
    Banned:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannedError"
      description: The bot's owner is banned; after the ban lifts, the owner must rotate the token.
    BotUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: Missing, unknown, or rotated bot token.
    Delisted:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DelistedError"
      description: The bot is delisted and takes no new games.
    GameOver:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameOverError"
      description: The game is already finished (game_over).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
      description: The target does not exist or is not the caller's to act on.
    Paused:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PausedError"
      description: "The site is paused: no new stream, challenge, or game starts, and open streams and
        live games continue. Retry after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayloadTooLargeError"
      description: The body is larger than 16 KiB (payload_too_large).
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: "Too many requests (rate_limited): one client, by network address, makes 60 at once,
        then 10 a second; operations needing no credential take 300 at once, then 100 a second from
        all callers together; each bot, user, guest, or game seat makes 20 at once, then 2 a second
        with its credential, and an account changes its bots 10 at once, then 1 a minute. Retry
        after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: No session cookie, or the session is expired or unknown.
  schemas:
    Accepts:
      description: The clocks the bot plays; a bot that never declared accepts plays none.
      properties:
        match:
          description: True to play any match clock.
          type: boolean
        turnMs:
          description: The turn clocks the bot plays, as the inclusive [min, max] of turnTimeMs; null refuses
            turn clocks.
          items:
            type: integer
          maxItems: 2
          minItems: 2
          nullable: true
          type: array
        unlimited:
          description: True to play games with no clock.
          type: boolean
      required:
        - turnMs
        - match
        - unlimited
      type: object
    Account:
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - rating
        - provisional
      type: object
    AccountDeclaration:
      additionalProperties: false
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      type: object
    BadRequestError:
      properties:
        code:
          enum:
            - bad_request
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BannedError:
      properties:
        code:
          enum:
            - banned
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Board:
      properties:
        cells:
          items:
            properties:
              p:
                enum:
                  - x
                  - o
                type: string
              q:
                type: integer
              r:
                type: integer
            required:
              - q
              - r
              - p
            type: object
          type: array
        to_move:
          enum:
            - x
            - o
          type: string
      required:
        - to_move
        - cells
      type: object
    BotLimitError:
      properties:
        code:
          enum:
            - bot_limit
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotListing:
      description: The declaration fields are absent until the bot declares them.
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        liveGames:
          description: The games the bot is playing now; at 4 it takes no new one.
          maximum: 4
          minimum: 0
          type: integer
        name:
          type: string
        online:
          description: True while the bot holds its stream open.
          type: boolean
        openForChallenges:
          description: True while the bot holds its stream open with open=1.
          type: boolean
        ownerName:
          nullable: true
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - ownerName
        - online
        - openForChallenges
        - rating
        - provisional
        - liveGames
      type: object
    BotNameError:
      properties:
        code:
          enum:
            - invalid_name
            - name_reserved
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotToken:
      properties:
        name:
          type: string
        token:
          pattern: ^hxo_[A-Za-z0-9_-]{43}$
          type: string
      required:
        - name
        - token
      type: object
    Challenge:
      description: firstPlayer picks who moves first after the opening, on turn (openingPlies + 1) / 2. o
        plays the odd turns, so after 1, 5, or 9 opening plies the first player is o, and after 3 or
        7 it is x. random is drawn at acceptance; gameStart.side gives each bot its side.
      properties:
        challengeId:
          type: string
        challenger:
          $ref: "#/components/schemas/Player"
        destUser:
          $ref: "#/components/schemas/Player"
        firstPlayer:
          enum:
            - challenger
            - challenged
            - random
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        status:
          enum:
            - created
            - accepted
            - declined
            - canceled
            - expired
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
      required:
        - challengeId
        - challenger
        - destUser
        - timeControl
        - openingPlies
        - firstPlayer
        - status
      type: object
    ChallengeAcceptError:
      properties:
        code:
          enum:
            - bad_request
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCanceledEvent:
      description: A cancel reaches the target with reason canceled; an expiry reaches both sides with
        reason expired.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        reason:
          enum:
            - canceled
            - expired
          type: string
        type:
          enum:
            - challengeCanceled
          type: string
      required:
        - type
        - reason
        - challenge
      type: object
    ChallengeCreateError:
      properties:
        code:
          enum:
            - bad_request
            - not_open
            - clock_not_accepted
            - bot_busy
            - inbox_full
            - challenge_pending
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCreatedEvent:
      description: A pending challenge for the bot, sent on creation and replayed as the stream opens.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challenge
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeDeclinedEvent:
      description: The target declined; sent to the challenger.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challengeDeclined
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeForbiddenError:
      properties:
        code:
          enum:
            - banned
            - own_bot
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeQuotaError:
      properties:
        code:
          enum:
            - daily_challenge_cap
            - daily_pair_cap
            - daily_bot_cap
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    DelistedError:
      properties:
        code:
          enum:
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    DiscordNames:
      description: The Discord account behind a session, shown only to its owner.
      properties:
        displayName:
          maxLength: 32
          minLength: 1
          nullable: true
          type: string
        username:
          maxLength: 32
          minLength: 1
          type: string
      required:
        - username
        - displayName
      type: object
    EngineSession:
      properties:
        socketUrl:
          description: A path on the API's origin; dial it as wss://, or ws:// where the API is http://.
          type: string
        token:
          description: "The game token (hgs_...): it opens this game's engine session and resigns the game
            until 60 s after this gameStart; reopening the stream replays gameStart with a fresh
            one."
          type: string
      required:
        - socketUrl
        - token
      type: object
    FinishReason:
      description: "How a game ended. six-in-a-row: the winner completed six in a row. timeout: the
        loser's clock ran out. surrender: the loser resigned. disconnect: the loser's stream stayed
        closed for 30 s. terminated: the loser played an illegal move, or, with no winner, the game
        reached 500 turns or an unlimited game 24 hours. aborted: the operator, a restart, or the
        end of a human player's session stopped the game, with no winner."
      enum:
        - aborted
        - disconnect
        - surrender
        - timeout
        - terminated
        - six-in-a-row
      type: string
    FinishedGameEntry:
      description: A finished game as the history lists it. Each seat's rating is the one it stood at
        before this result, and provisional says whether its deviation was above 75 after it.
      properties:
        finishedAt:
          format: date-time
          type: string
        gameId:
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        players:
          $ref: "#/components/schemas/GamePlayers"
        rated:
          description: False for a game without a winner and for a voided one.
          type: boolean
        reason:
          $ref: "#/components/schemas/FinishReason"
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        turns:
          description: Turns on the board at the finish, the opening's included.
          minimum: 0
          type: integer
        winner:
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - gameId
        - players
        - winner
        - reason
        - timeControl
        - openingPlies
        - turns
        - finishedAt
        - rated
      type: object
    FinishedGamesPage:
      properties:
        games:
          items:
            $ref: "#/components/schemas/FinishedGameEntry"
          maxItems: 20
          type: array
        next:
          description: The cursor of the next page; null on the last one.
          nullable: true
          pattern: ^(?:[2-9]|10)\.[1-9][0-9]{0,14}$
          type: string
        page:
          maximum: 10
          minimum: 1
          type: integer
        previous:
          description: The cursor of the page before; null when that page is the first, or on the first.
          nullable: true
          pattern: ^(?:[2-9]|10)\.[1-9][0-9]{0,14}$
          type: string
        record:
          description: Present when the query names a player.
          properties:
            asO:
              properties:
                games:
                  minimum: 0
                  type: integer
                lost:
                  minimum: 0
                  type: integer
                won:
                  minimum: 0
                  type: integer
              required:
                - games
                - won
                - lost
              type: object
            asX:
              properties:
                games:
                  minimum: 0
                  type: integer
                lost:
                  minimum: 0
                  type: integer
                won:
                  minimum: 0
                  type: integer
              required:
                - games
                - won
                - lost
              type: object
            games:
              minimum: 0
              type: integer
            lost:
              minimum: 0
              type: integer
            undecided:
              description: Games that ended without a winner.
              minimum: 0
              type: integer
            won:
              minimum: 0
              type: integer
          required:
            - games
            - won
            - lost
            - undecided
            - asX
            - asO
          type: object
      required:
        - games
        - next
        - previous
        - page
      type: object
    GameBoard:
      properties:
        cells:
          items:
            properties:
              side:
                enum:
                  - x
                  - o
                type: string
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
              - side
            type: object
          type: array
      required:
        - cells
      type: object
    GameClock:
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            remainingTurnMs:
              minimum: 0
              type: integer
          required:
            - mode
            - remainingTurnMs
          type: object
        - properties:
            mode:
              enum:
                - match
              type: string
            remainingMainMs:
              properties:
                o:
                  minimum: 0
                  type: integer
                x:
                  minimum: 0
                  type: integer
              required:
                - x
                - o
              type: object
          required:
            - mode
            - remainingMainMs
          type: object
    GameCooldownError:
      properties:
        code:
          enum:
            - game_cooldown
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GameCreateError:
      properties:
        code:
          enum:
            - bad_request
            - human_busy
            - not_open
            - clock_not_accepted
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GameEvent:
      description: "One server-sent event: the event field names the kind, and the data field holds the
        payload as one line of JSON."
      oneOf:
        - properties:
            data:
              $ref: "#/components/schemas/GameSnapshot"
            event:
              enum:
                - snapshot
              type: string
          required:
            - event
            - data
          type: object
        - properties:
            data:
              $ref: "#/components/schemas/GameTurn"
            event:
              enum:
                - turn
              type: string
          required:
            - event
            - data
          type: object
        - properties:
            data:
              $ref: "#/components/schemas/GameFinish"
            event:
              enum:
                - finish
              type: string
          required:
            - event
            - data
          type: object
    GameFinish:
      description: The result, with the clock as it stood at the end.
      properties:
        clock:
          $ref: "#/components/schemas/GameClock"
        reason:
          $ref: "#/components/schemas/FinishReason"
        winner:
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - winner
        - reason
        - clock
      type: object
    GameFinishEvent:
      properties:
        gameId:
          type: string
        reason:
          $ref: "#/components/schemas/FinishReason"
        type:
          enum:
            - gameFinish
          type: string
        winner:
          description: Null after aborted, and after terminated at the turn or time cap.
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - type
        - gameId
        - winner
        - reason
      type: object
    GameOverError:
      properties:
        code:
          enum:
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GamePlayer:
      properties:
        kind:
          enum:
            - bot
            - user
            - guest
          type: string
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
            - nullable: true
      required:
        - name
        - rating
        - provisional
        - kind
      type: object
    GamePlayers:
      properties:
        o:
          $ref: "#/components/schemas/GamePlayer"
        x:
          $ref: "#/components/schemas/GamePlayer"
      required:
        - x
        - o
      type: object
    GameSnapshot:
      description: you is the caller's side, present exactly when the caller holds a seat. board.cells
        lists stones in ply order, so its first openingPlies entries are the opening.
      oneOf:
        - properties:
            board:
              $ref: "#/components/schemas/GameBoard"
            clock:
              $ref: "#/components/schemas/GameClock"
            gameId:
              type: string
            openingPlies:
              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            status:
              enum:
                - in-progress
              type: string
            timeControl:
              $ref: "#/components/schemas/TimeControl"
            toMove:
              enum:
                - x
                - o
              type: string
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - timeControl
            - status
            - toMove
            - clock
          type: object
        - properties:
            board:
              $ref: "#/components/schemas/GameBoard"
            clock:
              $ref: "#/components/schemas/GameClock"
            gameId:
              type: string
            openingPlies:
              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            reason:
              $ref: "#/components/schemas/FinishReason"
            status:
              enum:
                - finished
              type: string
            timeControl:
              $ref: "#/components/schemas/TimeControl"
            winner:
              enum:
                - x
                - o
                - null
              nullable: true
              type: string
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - timeControl
            - status
            - winner
            - reason
          type: object
    GameStartEvent:
      description: A game the bot plays has started, or is replayed as the stream opens. A game started by
        a player on the website arrives with no challenge before it.
      properties:
        engine:
          $ref: "#/components/schemas/EngineSession"
        gameId:
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        opponent:
          $ref: "#/components/schemas/Seat"
        rated:
          description: False for a game against a guest, which moves no rating.
          type: boolean
        side:
          enum:
            - x
            - o
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        type:
          enum:
            - gameStart
          type: string
      required:
        - type
        - gameId
        - side
        - opponent
        - timeControl
        - openingPlies
        - rated
        - engine
      type: object
    GameTurn:
      description: One applied turn, numbered from turn 0 at the origin. cells holds its stones in order;
        a turn whose first stone wins holds that stone alone. toMove and clock are the game's state
        once the turn lands.
      properties:
        cells:
          items:
            properties:
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
            type: object
          maxItems: 2
          minItems: 1
          type: array
        clock:
          $ref: "#/components/schemas/GameClock"
        side:
          enum:
            - x
            - o
          type: string
        toMove:
          enum:
            - x
            - o
          type: string
        turn:
          minimum: 1
          type: integer
      required:
        - turn
        - side
        - cells
        - toMove
        - clock
      type: object
    Guest:
      properties:
        kind:
          enum:
            - guest
          type: string
        liveGames:
          $ref: "#/components/schemas/OwnLiveGames"
        name:
          pattern: ^Guest [a-z0-9]{4}$
          type: string
      required:
        - kind
        - name
        - liveGames
      type: object
    GuestLimitError:
      properties:
        code:
          enum:
            - guest_limit
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    InGameError:
      properties:
        code:
          enum:
            - in_game
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    LeaderboardBot:
      description: A bot carries its owner and presence as the bot list has them.
      properties:
        games:
          minimum: 1
          type: integer
        kind:
          enum:
            - bot
          type: string
        lastPlayedAt:
          format: date-time
          type: string
        name:
          type: string
        online:
          type: boolean
        ownerName:
          nullable: true
          type: string
        rank:
          minimum: 1
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - rank
        - name
        - rating
        - games
        - lastPlayedAt
        - kind
        - ownerName
        - online
      type: object
    LeaderboardEntry:
      description: rank is the position on the filtered board, games the rated games the player has
        played, and lastPlayedAt when the latest of them finished.
      discriminator:
        mapping:
          bot: "#/components/schemas/LeaderboardBot"
          human: "#/components/schemas/LeaderboardHuman"
        propertyName: kind
      oneOf:
        - $ref: "#/components/schemas/LeaderboardBot"
        - $ref: "#/components/schemas/LeaderboardHuman"
    LeaderboardHuman:
      properties:
        games:
          minimum: 1
          type: integer
        kind:
          enum:
            - human
          type: string
        lastPlayedAt:
          format: date-time
          type: string
        name:
          type: string
        rank:
          minimum: 1
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - rank
        - name
        - rating
        - games
        - lastPlayedAt
        - kind
      type: object
    LegalDetails:
      additionalProperties: false
      properties:
        host:
          additionalProperties: false
          properties:
            country:
              maxLength: 200
              minLength: 1
              type: string
            name:
              maxLength: 200
              minLength: 1
              type: string
            postcodeAndCity:
              maxLength: 200
              minLength: 1
              type: string
            serverLocation:
              maxLength: 200
              minLength: 1
              type: string
            street:
              maxLength: 200
              minLength: 1
              type: string
          required:
            - name
            - street
            - postcodeAndCity
            - country
            - serverLocation
          type: object
        mailProvider:
          additionalProperties: false
          properties:
            country:
              maxLength: 200
              minLength: 1
              type: string
            name:
              maxLength: 200
              minLength: 1
              type: string
            postcodeAndCity:
              maxLength: 200
              minLength: 1
              type: string
            street:
              maxLength: 200
              minLength: 1
              type: string
          required:
            - name
            - street
            - postcodeAndCity
            - country
          type: object
        operator:
          additionalProperties: false
          properties:
            country:
              maxLength: 200
              minLength: 1
              type: string
            discord:
              maxLength: 64
              minLength: 1
              type: string
            email:
              maxLength: 254
              pattern: ^[^\s@]+@[^\s@]+$
              type: string
            name:
              maxLength: 200
              minLength: 1
              type: string
            postcodeAndCity:
              maxLength: 200
              minLength: 1
              type: string
            street:
              maxLength: 200
              minLength: 1
              type: string
          required:
            - name
            - street
            - postcodeAndCity
            - country
            - email
          type: object
        supervisoryAuthority:
          additionalProperties: false
          properties:
            country:
              maxLength: 200
              minLength: 1
              type: string
            name:
              maxLength: 200
              minLength: 1
              type: string
            postcodeAndCity:
              maxLength: 200
              minLength: 1
              type: string
            street:
              maxLength: 200
              minLength: 1
              type: string
            url:
              maxLength: 2048
              pattern: ^https:\/\/\S+$
              type: string
          required:
            - name
            - street
            - postcodeAndCity
            - country
            - url
          type: object
      required:
        - operator
        - host
        - supervisoryAuthority
      type: object
    LiveGameEntry:
      description: A game in progress, its board and clock as its snapshot states them; a game with a
        guest seat is unrated.
      properties:
        cells:
          description: Every stone in ply order, the opening included.
          items:
            properties:
              side:
                enum:
                  - x
                  - o
                type: string
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
              - side
            type: object
          minItems: 1
          type: array
        clock:
          $ref: "#/components/schemas/GameClock"
        gameId:
          type: string
        players:
          $ref: "#/components/schemas/GamePlayers"
        rated:
          type: boolean
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        toMove:
          enum:
            - x
            - o
          type: string
      required:
        - gameId
        - players
        - timeControl
        - toMove
        - rated
        - cells
        - clock
      type: object
    MoveError:
      properties:
        code:
          enum:
            - bad_request
            - not_your_turn
            - cell_occupied
            - out_of_range
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    MoveRequest:
      properties:
        board:
          $ref: "#/components/schemas/Board"
        request_id:
          minimum: 0
          type: integer
        time_limit:
          minimum: 0
          type: number
      required:
        - board
      type: object
    MoveRequestEvent:
      description: Follows a replayed gameStart when the bot is to move, for information; it needs no
        answer, since the engine session sends its own move_request.
      properties:
        gameId:
          type: string
        request:
          $ref: "#/components/schemas/MoveRequest"
        type:
          enum:
            - moveRequest
          type: string
      required:
        - type
        - gameId
        - request
      type: object
    NameTakenError:
      properties:
        code:
          enum:
            - name_taken
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    NextPath:
      description: A path on this site, with its query, where a sign-in returns.
      maxLength: 256
      pattern: ^\/[A-Za-z0-9\-._~!$&'()*+,;=:@%/?]*$
      type: string
    NotFoundError:
      properties:
        code:
          enum:
            - not_found
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Ok:
      properties:
        ok:
          enum:
            - true
          type: boolean
      required:
        - ok
      type: object
    OpeningPlies:
      description: Stones the server places before either player acts, the origin at (0, 0) included. A
        ply is one stone; turn 0 is the origin, and turn t >= 1 is plies 2t-1 and 2t. Each later ply
        lands on an empty cell drawn uniformly from those within hex distance 2 of the origin. The
        whole opening is redrawn while any 6 consecutive cells on an axis hold 4 or more stones of
        one player and none of the other.
      enum:
        - 1
        - 3
        - 5
        - 7
        - 9
      type: integer
    OwnLiveGames:
      description: The person's live games, newest first.
      items:
        $ref: "#/components/schemas/LiveGameEntry"
      maxItems: 3
      type: array
    PausedError:
      properties:
        code:
          enum:
            - paused
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PayloadTooLargeError:
      properties:
        code:
          enum:
            - payload_too_large
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Player:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - name
        - rating
        - provisional
      type: object
    Provisional:
      description: True while the rating deviation is above 75.
      type: boolean
    RateLimitedError:
      properties:
        code:
          enum:
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Rating:
      description: The Glicko-2 rating, rounded to a whole point.
      type: integer
    Seat:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
            - nullable: true
      required:
        - name
        - rating
        - provisional
      type: object
    SignInFailure:
      description: Why a Discord sign-in did not finish.
      enum:
        - unconfigured
        - cancelled
        - expired
        - rejected
        - banned
        - busy
      type: string
    SignedInError:
      properties:
        code:
          enum:
            - signed_in
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Signup:
      properties:
        discord:
          $ref: "#/components/schemas/DiscordNames"
        next:
          $ref: "#/components/schemas/NextPath"
        suggestedName:
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
          type: string
      required:
        - discord
        - suggestedName
        - next
      type: object
    SignupCreated:
      properties:
        name:
          type: string
      required:
        - name
      type: object
    SignupEndedError:
      properties:
        code:
          enum:
            - signup_expired
            - signup_limit
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    SignupExpiredError:
      properties:
        code:
          enum:
            - signup_expired
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    SignupNameError:
      properties:
        code:
          enum:
            - invalid_name
            - name_reserved
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    SignupRequest:
      properties:
        name:
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
          type: string
      required:
        - name
      type: object
    SignupTakenError:
      properties:
        code:
          enum:
            - name_taken
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    StreamEvent:
      discriminator:
        mapping:
          challenge: "#/components/schemas/ChallengeCreatedEvent"
          challengeCanceled: "#/components/schemas/ChallengeCanceledEvent"
          challengeDeclined: "#/components/schemas/ChallengeDeclinedEvent"
          gameFinish: "#/components/schemas/GameFinishEvent"
          gameStart: "#/components/schemas/GameStartEvent"
          moveRequest: "#/components/schemas/MoveRequestEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/GameStartEvent"
        - $ref: "#/components/schemas/MoveRequestEvent"
        - $ref: "#/components/schemas/GameFinishEvent"
        - $ref: "#/components/schemas/ChallengeCreatedEvent"
        - $ref: "#/components/schemas/ChallengeCanceledEvent"
        - $ref: "#/components/schemas/ChallengeDeclinedEvent"
    TimeControl:
      description: turn gives each turn turnTimeMs, and unused time is lost; match gives each side
        mainTimeMs for the game, adding incrementMs after each of its turns; unlimited has no clock.
        Each move_request carries the seconds left for that move.
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            turnTimeMs:
              minimum: 5000
              type: integer
          required:
            - mode
            - turnTimeMs
          type: object
        - properties:
            incrementMs:
              minimum: 0
              type: integer
            mainTimeMs:
              minimum: 60000
              type: integer
            mode:
              enum:
                - match
              type: string
          required:
            - mode
            - mainTimeMs
            - incrementMs
          type: object
    UnauthorizedError:
      properties:
        code:
          enum:
            - unauthorized
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    User:
      description: discord is null for a session made without Discord.
      properties:
        discord:
          allOf:
            - $ref: "#/components/schemas/DiscordNames"
            - nullable: true
        kind:
          enum:
            - user
          type: string
        liveGames:
          $ref: "#/components/schemas/OwnLiveGames"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - kind
        - name
        - rating
        - provisional
        - discord
        - liveGames
      type: object
    WatcherLimitError:
      properties:
        code:
          enum:
            - watcher_limit
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: A bot token (hxo_...), minted and rotated by the owner on the website.
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: A game token (hgs_...) from a gameStart line.
      scheme: bearer
      type: http
    sessionCookie:
      description: An HttpOnly session cookie, set by a Discord sign-in, a created account, or the guest route.
      in: cookie
      name: hexo_arena_session
      type: apiKey
    signupCookie:
      description: An HttpOnly cookie for a first sign-in waiting for its public name, set by the Discord
        OAuth callback for 15 minutes.
      in: cookie
      name: hexo_arena_signup
      type: apiKey
info:
  title: HeXO Arena
  version: 0.29.0
openapi: 3.0.3
paths:
  /api/auth/discord/callback:
    get:
      description: "Requests the identify scope only and keeps the Discord id, username, and display name.
        A known account is signed in unless it is banned. An unknown account creates nothing: the
        callback holds a sign-up for 15 minutes behind the signup cookie and sends the visitor to
        /welcome to choose a public name. A failed sign-in creates no session."
      operationId: discordCallback
      responses:
        "302":
          description: A redirect to the return path with the session cookie set, to /welcome with the signup
            cookie set, or on failure to the return path with signin naming a SignInFailure;
            error=access_denied from Discord reads as cancelled.
          headers:
            Location:
              description: The return path, /welcome, or the return path with signin= and the reason.
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: "Finish Discord OAuth: sign in, or hold a first sign-in."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Each redirect carries a fresh state and nonce, valid once at the callback, and asks
        Discord to skip its screen for an app the account already allowed. The state keeps the
        return path.
      operationId: discordLogin
      parameters:
        - description: "Where the sign-in returns: a path on this site with its query, at most 256 characters.
            Missing or invalid, the sign-in returns to /."
          in: query
          name: next
          required: false
          schema:
            maxLength: 256
            type: string
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint; or to the return path with
            signin=unconfigured when Discord OAuth is not set up, or with signin=busy past 10 at
            once, then 1 every 30 s per client or with 500 sign-ins waiting on Discord.
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/auth/guest:
    post:
      description: The session lives in server memory only and ends at sign-out, a Discord sign-in, or a
        restart. It also ends after 24 h without a request, unless it sits in a live game. Every
        guest game is unrated.
      operationId: startGuest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: The caller already holds this guest session.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: A new guest session; the session cookie is set.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInError"
          description: A user is signed in.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLimitError"
          description: The global cap of 500 guest sessions is full (guest_limit), retry after 60 s; or one
            client started 3 at once, then 1 every 20 min (rate_limited), or too many requests.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Start an anonymous guest session.
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: "Idempotent: without a live session it still clears the cookie. Ending a guest session
        aborts its live games."
      operationId: logout
      responses:
        "204":
          description: The session is gone and the cookie cleared.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: "Sign out: end the session and clear its cookie."
      tags:
        - Auth
  /api/bot/account:
    get:
      description: The bot's name, rating, and stored declaration.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: Each present field replaces the stored one; an empty string clears a text field, and
        accepts is replaced whole. An unknown key answers 400. A challenge or game outside accepts
        answers clock_not_accepted.
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeclaration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account after the update.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Declare the bot's about, version, repo, and what it accepts.
      tags:
        - Account
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: Only the challenged bot may accept. The game starts at once, and both bots receive gameStart.
      operationId: acceptChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptError"
          description: The challenged bot is at its game cap (bot_busy); the challenge stays pending.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel; the target receives challengeCanceled.
      operationId: cancelChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Canceled.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline; the challenger receives challengeDeclined.
      operationId: declineChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Declined.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: The target must hold its stream open with open=1 and accept the clock. A bot plays at
        most 4 games at once. The target holds at most 10 pending challenges, 1 from each
        challenger. A challenge expires after 60 s. Resending a requestId answers 200 with the
        stored challenge.
      operationId: createChallenge
      parameters:
        - description: The challenged bot's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The stored challenge for a known requestId, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The challenge, pending in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateError"
          description: Validation failed (bad_request), the target is not open (not_open) or excludes the
            clock (clock_not_accepted), a side is at its game cap (bot_busy), the target's inbox is
            full (inbox_full), or the challenger already has a challenge pending with the target
            (challenge_pending).
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeForbiddenError"
          description: The challenger's owner owns the target (own_bot), either bot is delisted (delisted), or
            the challenger's owner is banned (banned).
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeQuotaError"
          description: Per UTC day a bot sends at most 200 challenges (daily_challenge_cap) and plays at most
            100 bot-vs-bot games (daily_bot_cap), and a pair 20 (daily_pair_cap), with Retry-After
            running to 00:00 UTC; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender; no engine session is needed.
      operationId: resignBotGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Resigned.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or rotated game token.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - gameToken: []
      summary: Resign a game with its game token.
      tags:
        - Engine session
  /api/bot/game/{gameId}/socket:
    get:
      description: "Speaks htttx basic_websocket v1-alpha: the bot dials, then answers each move_request
        with a move_response of two cells that echoes its request_id, or the answer is dropped. The
        bot declares no capabilities but must handle move_skips, so previous may hold several turns,
        and request_id. A new connection replaces the previous one. An illegal move forfeits."
      operationId: openEngineSession
      parameters:
        - $ref: "#/components/parameters/GameId"
        - description: The game token from the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: "Switching protocols; the engine session is open. The server first sends setup, whose
            board holds the origin stone alone. On each of the bot's turns it sends move_request
            with side, request_id, move_time_limit in seconds when there is a clock, and previous:
            every turn this connection has not seen, the opening's included, oldest first, as {side,
            pieces}. Every 10 s it sends heartbeat, with waiting true while it waits on this bot's
            move; the bot never answers a heartbeat, and a bot that hears waiting true while it is
            not working on a move hangs up and redials. No frame the server sends exceeds 64 KiB. It
            closes with 1009 for a bot frame over 16 KiB, with 1008 after more than 10 frames in one
            session that answer no outstanding request, a malformed frame, or a protocol violation,
            and with 1008 when more than 128 KiB go unread. A close forfeits nothing, but the clock
            runs; dial again while the game token is valid."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: Unknown game, or a game token that is expired or rotated.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A seat dials at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused dial leaves an open session alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: One StreamEvent per line, with a bare newline as keepalive every 10 s. Opening a stream
        closes the bot's previous one. The bot is online while its stream is open. On open, each
        active game replays as gameStart, followed by moveRequest on the bot's turn. Play runs on
        the engine session that gameStart hands out.
      operationId: openStream
      parameters:
        - description: "Present as 1, the bot is open while the stream is: other bots may challenge it, and
            players on the website may start games against it, which arrive as gameStart with no
            challenge."
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamEvent"
          description: The event stream, as NDJSON; no line is longer than 64 KiB. The server ends a stream
            that leaves more than 128 KiB unread. A bot whose stream stays closed for 30 s forfeits
            its live games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A bot opens at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused open leaves the open stream alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The listed roster, ordered by name fold, without pagination. Delisted bots and bots of
        banned owners are hidden.
      operationId: listBots
      parameters:
        - description: Present as 1, narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BotListing"
                type: array
          description: The roster.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the bot's token; this response is its only appearance. Names share one global
        namespace with users and never change.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its token.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotNameError"
          description: The name fails the name syntax or is reserved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLimitError"
          description: The owner already holds 3 bots.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameTakenError"
          description: The name fold is taken by a user or a bot.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}:
    delete:
      description: "A bot with rated games is anonymized: it becomes a deleted-<n> placeholder, its games
        and ratings stay, and its name stays reserved. A bot without rated games is deleted and its
        name freed."
      operationId: deleteBot
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "204":
          description: The bot and its token are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGameError"
          description: The bot is seated in a live game.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Delete a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}/token:
    post:
      description: The previous token stops working at once.
      operationId: rotateBotToken
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its new token, shown only here.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Rotate a bot token.
      tags:
        - Bots
  /api/games:
    get:
      description: Games in progress, newest first, at most 12, without pagination. Guest games are
        listed; finished games never are. The list is read at most once every 1 s, and every caller
        in that time gets the same body.
      operationId: listLiveGames
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LiveGameEntry"
                type: array
          description: The live games.
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List live games.
      tags:
        - Games
    post:
      description: The bot must hold its stream open with open=1, have fewer than 4 live games, and accept
        the clock. The caller, a user or guest, may hold 3 live games and create one every 60 s. The
        server draws sides and places the opening; the bot receives gameStart. A game against a
        guest is unrated.
      operationId: createGame
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bot:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - bot
                - timeControl
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The new game's snapshot.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCreateError"
          description: Validation failed (bad_request), the caller is at its live-game cap (human_busy), or
            the bot is not open (not_open), excludes the clock (clock_not_accepted), or is at its
            game cap (bot_busy).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Delisted"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCooldownError"
          description: The caller is inside the creation cooldown (game_cooldown), and Retry-After says how
            long it has left; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Start a game against a bot.
      tags:
        - Games
  /api/games/finished:
    get:
      description: Finished games, newest first, 20 a page, at most 10 pages per set of filters; before
        reaches older games. Guest games are never stored. A name no player holds, a deleted
        player's placeholder included, answers not_found. An identical query is read at most once
        every 5 s, every caller in that time getting the same body.
      operationId: listFinishedGames
      parameters:
        - description: A player's name, matched case-folded, in either seat.
          in: query
          name: player
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: The opponent's name; needs player.
          in: query
          name: vs
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: "Who sat: two bots, or a human and a bot."
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bot-bot
              - human-bot
            type: string
        - description: won and lost are the player's results and need player; none is a game without a winner.
          in: query
          name: result
          required: false
          schema:
            enum:
              - won
              - lost
              - none
            type: string
        - description: The player's side; needs player.
          in: query
          name: side
          required: false
          schema:
            enum:
              - x
              - o
            type: string
        - description: How the game ended.
          in: query
          name: reason
          required: false
          schema:
            enum:
              - aborted
              - disconnect
              - surrender
              - timeout
              - terminated
              - six-in-a-row
            type: string
        - description: The time control's mode.
          in: query
          name: clock
          required: false
          schema:
            enum:
              - turn
              - match
              - unlimited
            type: string
        - description: The opening's plies.
          in: query
          name: opening
          required: false
          schema:
            enum:
              - "1"
              - "3"
              - "5"
              - "7"
              - "9"
            type: string
        - description: Only games finished before this UTC date, YYYY-MM-DD.
          in: query
          name: before
          required: false
          schema:
            format: date
            type: string
        - description: The page after the last one read, as its next said.
          in: query
          name: cursor
          required: false
          schema:
            pattern: ^(?:[2-9]|10)\.[1-9][0-9]{0,14}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishedGamesPage"
          description: One page of games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List finished games.
      tags:
        - Games
  /api/games/{gameId}:
    get:
      description: Board, turn, and clock in one read; a finished game carries its result. Anyone may read
        a game, a guest's while the guest's session lives.
      operationId: getGameSnapshot
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The game's snapshot.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/ArchiveLimited"
      security:
        - sessionCookie: []
        - {}
      summary: Read any game.
      tags:
        - Games
  /api/games/{gameId}/events:
    get:
      description: "Server-sent events: on open a snapshot, then a turn event per applied turn, then a
        finish event, and the stream closes. A finished game sends its snapshot and closes. A
        comment line comes every 10 s. Events carry no ids and nothing replays: a reconnect gets a
        fresh snapshot."
      operationId: watchGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GameEvent"
          description: The event stream; the server ends one that leaves more than 128 KiB unread.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherLimitError"
          description: Watchers without a seat are capped at 50 per game, 500 in total, and 10 per client, and
            a seat holds at most 4 streams of its own game (watcher_limit), retry after 30 s; or a
            finished game read too often, as on getGameSnapshot, or too many requests
            (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Watch a game live.
      tags:
        - Games
  /api/games/{gameId}/move:
    post:
      description: Places both stones of the caller's turn. A win on the first placement ends the game,
        and the second is not applied. An illegal move answers 400 and forfeits nothing.
      operationId: playHumanMove
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cells:
                  items:
                    properties:
                      x:
                        type: integer
                      y:
                        type: integer
                    required:
                      - x
                      - y
                    type: object
                  type: array
              required:
                - cells
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The snapshot after the move.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveError"
          description: Validation failed (bad_request), it is not the caller's turn (not_your_turn), a cell is
            taken (cell_occupied) or out of range (out_of_range), or the game is over (game_over).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Play the two placements of the caller's turn.
      tags:
        - Games
  /api/games/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender.
      operationId: resignHumanGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The finished snapshot.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Resign a game the caller plays in.
      tags:
        - Games
  /api/leaderboard:
    get:
      description: Rankable players, highest rating first, ties by name fold, at most 500. A player is
        rankable at a rating deviation of 75 or below. Banned users, delisted bots, and bots of
        banned owners never appear. Bots and humans share one rating pool.
      operationId: getLeaderboard
      parameters:
        - description: Narrows the board to bots or humans; all when absent.
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bots
              - humans
              - all
            type: string
        - description: Players whose latest rated game finished in the last 30 days, or all; 30 days when
            absent.
          in: query
          name: active
          required: false
          schema:
            enum:
              - 30d
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
                maxItems: 500
                type: array
          description: The board.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List rankable players by rating.
      tags:
        - Directory
  /api/legal:
    get:
      description: The values the legal pages show, read once at start from the deployment's file; a
        development server without the file answers 404.
      operationId: getLegalDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDetails"
          description: The legal details.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: The operator's legal details.
      tags:
        - Site
  /api/me:
    get:
      description: Reads the session cookie alone; without a live session the answer is null, never 401.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/Guest"
                  - nullable: true
          description: The session's user or guest, or null.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: Who the session names.
      tags:
        - Auth
  /api/signup:
    delete:
      description: "Idempotent: deletes whatever the cookie holds and clears the cookie."
      operationId: cancelSignup
      responses:
        "204":
          description: Nothing of the sign-up is kept.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
        - {}
      summary: Drop the first sign-in without creating the account.
      tags:
        - Auth
    get:
      description: The Discord account the sign-in came from, names up to 32 characters, a name made from
        its username that is free at the time of the read, and where the sign-in returns once the
        account exists.
      operationId: getSignup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signup"
          description: The waiting sign-up.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupExpiredError"
          description: "No sign-up waits for this cookie: it expired, was used, or never existed."
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
      summary: Read the first sign-in waiting for its public name.
      tags:
        - Auth
    post:
      description: Creates the account and its session, ends whatever session the browser held, a guest's
        with its games, and clears the signup cookie. The name shares one global namespace with bots
        and never changes. A sign-up takes at most 10 names; past that it ends.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupCreated"
          description: The account exists; the session cookie is set.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupNameError"
          description: The chosen public name fails the name syntax or is reserved.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupTakenError"
          description: Another user or a bot holds the chosen name's fold.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEndedError"
          description: No sign-up waits for this cookie (signup_expired), or it tried 10 names and has ended
            (signup_limit); signing in again starts a new one.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
      summary: Create the account under the chosen public name.
      tags:
        - Auth
  /healthz:
    get:
      responses:
        "200":
          description: The process is up and serving.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The process is up and paused.
      summary: Liveness probe.
