  /api/bots:
    get:
      description: The whole listed roster, ordered by name fold; delisted bots and bots of banned owners
        are hidden. Hobby scale, no pagination yet. online and openForChallenges are live views of
        who holds a stream open; the declaration fields appear once the bot declares itself. rating
        is Glicko-2 in whole points, provisional while the deviation is above 75.
      operationId: listBots
      parameters:
        - description: Narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    about:
                      maxLength: 280
                      type: string
                    accepts:
                      properties:
                        match:
                          type: boolean
                        turnMs:
                          items:
                            type: integer
                          maxItems: 2
                          minItems: 2
                          nullable: true
                          type: array
                        unlimited:
                          type: boolean
                      required:
                        - turnMs
                        - match
                        - unlimited
                      type: object
                    name:
                      type: string
                    online:
                      type: boolean
                    openForChallenges:
                      type: boolean
                    ownerName:
                      nullable: true
                      type: string
                    provisional:
                      type: boolean
                    rating:
                      type: integer
                    repoUrl:
                      anyOf:
                        - format: uri
                          maxLength: 2048
                          type: string
                        - enum:
                            - ""
                          type: string
                    version:
                      maxLength: 64
                      type: string
                  required:
                    - name
                    - ownerName
                    - online
                    - openForChallenges
                    - rating
                    - provisional
                  type: object
                type: array
          description: The bot roster.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
      security: []
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the token exactly once; this response is the only place it ever appears in the
        clear. Names share one global namespace with users and are immutable.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                  token:
                    pattern: ^hxo_[A-Za-z0-9_-]{43}$
                    type: string
                required:
                  - name
                  - token
                type: object
          description: The bot exists; the token will not be shown again.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - invalid_name
                      - name_reserved
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fails the syntax rules or is reserved.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bot_limit
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The owner already holds the per-user bot cap (3).
        "409":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - name_taken
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fold is already taken, by a user or a bot.
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
