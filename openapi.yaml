      required:
        - username
        - displayName
      type: object
    EngineSession:
      properties:
        socketUrl:
          description: A path on the API's origin; dial it as wss://, or ws:// where the API is http://.
          type: string
        token:
          description: "The game token (hgs_...): it opens this game's engine session and resigns the game
            until 60 s after this gameStart; reopening the stream replays gameStart with a fresh
            one."
          type: string
      required:
        - socketUrl
        - token
      type: object
    Estimate:
      description: A test's estimate over the games played so far, counted by openings since an opening's
        two games share it, with one opening won and one lost added so a short run or a sweep stays
        finite.
      properties:
        chance:
          description: The chance the first is the stronger.
          maximum: 1
          minimum: 0
          type: number
        favored:
          description: The side the chance favors, null at even.
          enum:
            - first
            - second
            - null
          nullable: true
          type: string
        games:
          maximum: 70
          minimum: 1
          type: integer
        high:
          description: The 95% range's upper end; null where it runs past any finite difference.
          nullable: true
          type: integer
        low:
          description: The 95% range's lower end; null where it runs past any finite difference.
          nullable: true
          type: integer
        narrowed:
          description: How far the range would reach either way after another 50 games; null where it would
            still run past any finite difference.
          nullable: true
          type: integer
        points:
          description: Each side's points, a game without a winner a half to each.
          properties:
            first:
              minimum: 0
              type: number
            second:
              minimum: 0
              type: number
          required:
            - first
            - second
          type: object
        rating:
          description: How many rating points stronger the first is; below zero, weaker.
          type: integer
        verdict:
          description: "For the favored side: stronger at a chance of 99% or more, likely_stronger from 95%,
            else too_close."
          enum:
            - stronger
            - likely_stronger
            - too_close
          type: string
      required:
        - games
        - points
        - rating
        - low
        - high
        - chance
        - favored
        - verdict
        - narrowed
      type: object
    ExportedRating:
      nullable: true
      properties:
        deviation:
          type: number
        rating:
          type: number
        volatility:
          type: number
      required:
        - rating
        - deviation
        - volatility
      type: object
    ExportedSeat:
      properties:
        kind:
          enum:
            - bot
            - user
            - guest
          type: string
        level:
          $ref: "#/components/schemas/SeatLevel"
        name:
          type: string
        yours:
          description: True for the account itself and for its own bots.
          type: boolean
      required:
        - name
        - kind
        - yours
      type: object
    FinishReason:
      description: "How a game ended. six-in-a-row: the winner completed six in a row. timeout: the
        loser's clock ran out. surrender: the loser resigned. disconnect: the loser's stream stayed
        closed for 30 s. terminated: the loser played an illegal move, or, with no winner, the game
        reached 500 turns or 24 hours. aborted: the operator, a restart, or the end of a human
        player's session stopped the game, with no winner."
      enum:
        - aborted
        - disconnect
        - surrender
        - timeout
        - terminated
        - six-in-a-row
        - null
      nullable: true
      type: string
    FinishedGameEntry:
      description: A finished game as the history lists it. Each seat's rating is the one it stood at
        before this result, and provisional says whether its deviation was above 75 after it.
      properties:
        analyses:
          description: Finished community readings of the whole game.
          maximum: 2
          minimum: 0
