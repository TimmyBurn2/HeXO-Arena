components:
  parameters: {}
  schemas: {}
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: "A bot token, Authorization: Bearer hxo_..., minted and rotated by the owner on the
        website; there is no token endpoint."
      scheme: bearer
      type: http
    sessionCookie:
      description: A browser session, set by the Discord OAuth callback and readable only by the server.
      in: cookie
      name: hexarena_session
      type: apiKey
info:
  title: hexarena
  version: 0.3.0
openapi: 3.0.3
paths:
  /api/auth/discord/callback:
    get:
      description: "Identify scope only: the Discord id and username, never an email. On success sets the
        session cookie and redirects to the app root."
      operationId: discordCallback
      responses:
        "302":
          description: Session cookie set; redirect to /.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_state
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The state is unknown, expired, or already used.
        "502":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - discord_error
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord rejected the code or the identity lookup failed.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Finish Discord OAuth: create the session."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Mandatory state and nonce, generated per redirect and validated once at the callback.
      operationId: discordLogin
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/bot/account:
    patch:
      description: "Only the process holding the token may promise behaviour, which is why this is the
        bot's surface and not the owner's. Every field is optional; each present field replaces the
        stored one, an empty string clears a text field, and accepts replaces wholesale. The
        declaration narrows open=1: a challenge outside accepts is answered not-open."
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                about:
                  maxLength: 280
                  type: string
                accepts:
                  properties:
                    match:
                      type: boolean
                    turnMs:
                      items:
                        type: integer
                      maxItems: 2
                      minItems: 2
                      nullable: true
                      type: array
                    unlimited:
                      type: boolean
                  required:
                    - turnMs
                    - match
                    - unlimited
                  type: object
                repoUrl:
                  anyOf:
                    - format: uri
                      maxLength: 2048
                      type: string
                    - enum:
                        - ""
                      type: string
                version:
                  maxLength: 64
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  about:
                    maxLength: 280
                    type: string
                  accepts:
                    properties:
                      match:
                        type: boolean
                      turnMs:
                        items:
                          type: integer
                        maxItems: 2
                        minItems: 2
                        nullable: true
                        type: array
                      unlimited:
                        type: boolean
                    required:
                      - turnMs
                      - match
                      - unlimited
                    type: object
                  name:
                    type: string
                  repoUrl:
                    anyOf:
                      - format: uri
                        maxLength: 2048
                        type: string
                      - enum:
                          - ""
                        type: string
                  version:
                    maxLength: 64
                    type: string
                required:
                  - name
                type: object
          description: The stored declaration, as the account stands now.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned.
      security:
        - bearerAuth: []
      summary: Declare the bot's about, version, repo, and what it accepts.
      tags:
        - Account
  /api/bot/stream:
    get:
      description: "One JSON object per line, with a bare newline as keepalive every 10 s. One stream per
        bot: opening closes the previous one. The connection is the bot's presence, so it is online
        while the stream is held, and open=1 takes challenges for as long as it lasts. On open,
        every active game is replayed as a gameStart line followed by a fresh moveRequest when it is
        the bot's turn."
      operationId: openStream
      parameters:
        - description: Present as open=1, the bot accepts challenges while connected.
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - properties:
                      gameId:
                        type: string
                      opening:
                        properties:
                          randomTurns:
                            maximum: 3
                            minimum: 0
                            type: integer
                        required:
                          - randomTurns
                        type: object
                      opponent:
                        properties:
                          name:
                            type: string
                        required:
                          - name
                        type: object
                      rated:
                        type: boolean
                      side:
                        enum:
                          - x
                          - o
                        type: string
                      timeControl:
                        oneOf:
                          - properties:
                              mode:
                                enum:
                                  - unlimited
                                type: string
                            required:
                              - mode
                            type: object
                          - properties:
                              mode:
                                enum:
                                  - turn
                                type: string
                              turnTimeMs:
                                minimum: 5000
                                type: integer
                            required:
                              - mode
                              - turnTimeMs
                            type: object
                          - properties:
                              incrementMs:
                                minimum: 0
                                type: integer
                              mainTimeMs:
                                minimum: 60000
                                type: integer
                              mode:
                                enum:
                                  - match
                                type: string
                            required:
                              - mode
                              - mainTimeMs
                              - incrementMs
                            type: object
                      type:
                        enum:
                          - gameStart
                        type: string
                    required:
                      - type
                      - gameId
                      - side
                      - opponent
                      - timeControl
                      - rated
                    type: object
                  - properties:
                      gameId:
                        type: string
                      request:
                        properties:
                          board:
                            properties:
                              cells:
                                items:
                                  properties:
                                    p:
                                      enum:
                                        - x
                                        - o
                                      type: string
                                    q:
                                      type: integer
                                    r:
                                      type: integer
                                  required:
                                    - q
                                    - r
                                    - p
                                  type: object
                                type: array
                              to_move:
                                enum:
                                  - x
                                  - o
                                type: string
                            required:
                              - to_move
                              - cells
                            type: object
                          request_id:
                            minimum: 0
                            type: integer
                          time_limit:
                            minimum: 0
                            type: number
                        required:
                          - board
                        type: object
                      type:
                        enum:
                          - moveRequest
                        type: string
                    required:
                      - type
                      - gameId
                      - request
                    type: object
                  - properties:
                      gameId:
                        type: string
                      reason:
                        enum:
                          - aborted
                          - disconnect
                          - surrender
                          - timeout
                          - terminated
                          - six-in-a-row
                        type: string
                      type:
                        enum:
                          - gameFinish
                        type: string
                      winner:
                        enum:
                          - x
                          - o
                          - null
                        nullable: true
                        type: string
                    required:
                      - type
                      - gameId
                      - winner
                      - reason
                    type: object
                  - properties:
                      challenge:
                        properties:
                          challengeId:
                            type: string
                          challenger:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          destUser:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          status:
                            enum:
                              - created
                              - declined
                              - canceled
                              - expired
                            type: string
                          timeControl:
                            oneOf:
                              - properties:
                                  mode:
                                    enum:
                                      - unlimited
                                    type: string
                                required:
                                  - mode
                                type: object
                              - properties:
                                  mode:
                                    enum:
                                      - turn
                                    type: string
                                  turnTimeMs:
                                    minimum: 5000
                                    type: integer
                                required:
                                  - mode
                                  - turnTimeMs
                                type: object
                              - properties:
                                  incrementMs:
                                    minimum: 0
                                    type: integer
                                  mainTimeMs:
                                    minimum: 60000
                                    type: integer
                                  mode:
                                    enum:
                                      - match
                                    type: string
                                required:
                                  - mode
                                  - mainTimeMs
                                  - incrementMs
                                type: object
                        required:
                          - challengeId
                          - challenger
                          - destUser
                          - timeControl
                          - status
                        type: object
                      type:
                        enum:
                          - challenge
                        type: string
                    required:
                      - type
                      - challenge
                    type: object
                  - properties:
                      challenge:
                        properties:
                          challengeId:
                            type: string
                          challenger:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          destUser:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          status:
                            enum:
                              - created
                              - declined
                              - canceled
                              - expired
                            type: string
                          timeControl:
                            oneOf:
                              - properties:
                                  mode:
                                    enum:
                                      - unlimited
                                    type: string
                                required:
                                  - mode
                                type: object
                              - properties:
                                  mode:
                                    enum:
                                      - turn
                                    type: string
                                  turnTimeMs:
                                    minimum: 5000
                                    type: integer
                                required:
                                  - mode
                                  - turnTimeMs
                                type: object
                              - properties:
                                  incrementMs:
                                    minimum: 0
                                    type: integer
                                  mainTimeMs:
                                    minimum: 60000
                                    type: integer
                                  mode:
                                    enum:
                                      - match
                                    type: string
                                required:
                                  - mode
                                  - mainTimeMs
                                  - incrementMs
                                type: object
                        required:
                          - challengeId
                          - challenger
                          - destUser
                          - timeControl
                          - status
                        type: object
                      reason:
                        enum:
                          - canceled
                          - expired
                        type: string
                      type:
                        enum:
                          - challengeCanceled
                        type: string
                    required:
                      - type
                      - reason
                      - challenge
                    type: object
                  - properties:
                      challenge:
                        properties:
                          challengeId:
                            type: string
                          challenger:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          destUser:
                            properties:
                              name:
                                type: string
                            required:
                              - name
                            type: object
                          status:
                            enum:
                              - created
                              - declined
                              - canceled
                              - expired
                            type: string
                          timeControl:
                            oneOf:
                              - properties:
                                  mode:
                                    enum:
                                      - unlimited
                                    type: string
                                required:
                                  - mode
                                type: object
                              - properties:
                                  mode:
                                    enum:
                                      - turn
                                    type: string
                                  turnTimeMs:
                                    minimum: 5000
                                    type: integer
                                required:
                                  - mode
                                  - turnTimeMs
                                type: object
                              - properties:
                                  incrementMs:
                                    minimum: 0
                                    type: integer
                                  mainTimeMs:
                                    minimum: 60000
                                    type: integer
                                  mode:
                                    enum:
                                      - match
                                    type: string
                                required:
                                  - mode
                                  - mainTimeMs
                                  - incrementMs
                                type: object
                        required:
                          - challengeId
                          - challenger
                          - destUser
                          - timeControl
                          - status
                        type: object
                      type:
                        enum:
                          - challengeDeclined
                        type: string
                    required:
                      - type
                      - challenge
                    type: object
          description: The NDJSON event stream.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned.
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The whole roster, ordered by name fold; hobby scale, no pagination yet. online and
        openForChallenges are live views of who holds a stream open; the declaration fields appear
        once the bot declares itself.
      operationId: listBots
      parameters:
        - description: Narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    about:
                      maxLength: 280
                      type: string
                    accepts:
                      properties:
                        match:
                          type: boolean
                        turnMs:
                          items:
                            type: integer
                          maxItems: 2
                          minItems: 2
                          nullable: true
                          type: array
                        unlimited:
                          type: boolean
                      required:
                        - turnMs
                        - match
                        - unlimited
                      type: object
                    name:
                      type: string
                    online:
                      type: boolean
                    openForChallenges:
                      type: boolean
                    ownerName:
                      nullable: true
                      type: string
                    repoUrl:
                      anyOf:
                        - format: uri
                          maxLength: 2048
                          type: string
                        - enum:
                            - ""
                          type: string
                    version:
                      maxLength: 64
                      type: string
                  required:
                    - name
                    - ownerName
                    - online
                    - openForChallenges
                  type: object
                type: array
          description: The bot roster.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
      security: []
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the token exactly once; this response is the only place it ever appears in the
        clear. Names share one global namespace with users and are immutable.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                  token:
                    pattern: ^hxo_[A-Za-z0-9_-]{43}$
                    type: string
                required:
                  - name
                  - token
                type: object
          description: The bot exists; the token will not be shown again.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - invalid_name
                      - name_reserved
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fails the syntax rules or is reserved.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bot_limit
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The owner already holds the per-user bot cap (3).
        "409":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - name_taken
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fold is already taken, by a user or a bot.
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}:
    delete:
      operationId: deleteBot
      parameters:
        - description: "Targeting by name is unambiguous: names are immutable and fold-unique."
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The bot and its token are gone.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - sessionCookie: []
      summary: Delete a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}/token:
    post:
      description: The previous token dies immediately; the response carries the only appearance of the new one.
      operationId: rotateBotToken
      parameters:
        - description: "Targeting by name is unambiguous: names are immutable and fold-unique."
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                  token:
                    pattern: ^hxo_[A-Za-z0-9_-]{43}$
                    type: string
                required:
                  - name
                  - token
                type: object
          description: The fresh token, shown once.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - sessionCookie: []
      summary: Rotate a bot token.
      tags:
        - Bots
  /healthz:
    get:
      responses:
        "200":
          description: The process is up.
      summary: Liveness probe.
