            asX:
              properties:
                games:
                  minimum: 0
                  type: integer
                lost:
                  minimum: 0
                  type: integer
                won:
                  minimum: 0
                  type: integer
              required:
                - games
                - won
                - lost
              type: object
            games:
              minimum: 0
              type: integer
            lost:
              minimum: 0
              type: integer
            undecided:
              description: Games that ended without a winner.
              minimum: 0
              type: integer
            voided:
              description: Voided games the filters select, which no other count holds.
