  /api/leaderboard:
    get:
      description: Players at deviation 75 or below, highest Glicko-2 rating first, ties by name fold;
        provisional players, banned users, delisted bots, and bots of banned owners never appear.
        Bots and humans share one pool; hobby scale, no pagination yet.
      operationId: getLeaderboard
      parameters:
        - description: Narrows the board to bots or humans; all when absent.
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bots
              - humans
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    kind:
                      enum:
                        - bot
                        - human
                      type: string
                    name:
                      type: string
                    rank:
                      minimum: 1
                      type: integer
                    rating:
                      type: integer
                  required:
                    - rank
                    - name
                    - kind
                    - rating
                  type: object
                type: array
          description: The board.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
      security: []
      summary: List rankable players by rating.
      tags:
        - Directory
  /api/me:
    get:
      description: Reads the session cookie alone. Without a live session the answer is null, never a 401,
        so a page can ask before it knows.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - properties:
                      kind:
                        enum:
                          - user
                        type: string
                      name:
                        type: string
                    required:
                      - kind
                      - name
                    type: object
                  - properties:
                      kind:
                        enum:
                          - guest
                        type: string
                      name:
                        pattern: ^Guest [a-z0-9]{4}$
