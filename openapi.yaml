components:
  parameters: {}
  schemas: {}
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: "A bot token, Authorization: Bearer hxo_..., minted and rotated by the owner on the
        website; there is no token endpoint."
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: "A short-lived per-game engine-session token from the gameStart line, Authorization:
        Bearer hgs_...; every replay of gameStart rotates it."
      scheme: bearer
      type: http
    sessionCookie:
      description: A browser session, set by the Discord OAuth callback or the guest route and readable
        only by the server.
      in: cookie
      name: hexarena_session
      type: apiKey
info:
  title: hexarena
  version: 0.16.0
openapi: 3.0.3
paths:
  /api/auth/discord/callback:
    get:
      description: "Identify scope only: the Discord id and username, never an email. On success sets the
        session cookie and redirects to the app root."
      operationId: discordCallback
      responses:
        "302":
          description: Session cookie set; redirect to /.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_state
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The state is unknown, expired, or already used.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The Discord identity belongs to a banned user; no session is created.
        "502":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - discord_error
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord rejected the code or the identity lookup failed.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Finish Discord OAuth: create the session."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Mandatory state and nonce, generated per redirect and validated once at the callback.
      operationId: discordLogin
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/auth/guest:
    post:
      description: "Nothing is persisted: the session lives in server memory, ends at sign-out, after 24
        hours without a request, or at a restart, and is never swept while it sits in a live game. A
        guest plays bots under the human limits and every guest game is unrated for both sides.
        Signing in with Discord over a guest session ends it. Asking again with a live guest session
        answers that same guest."
      operationId: startGuest
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  kind:
                    enum:
                      - guest
                    type: string
                  name:
                    pattern: ^Guest [a-z0-9]{4}$
                    type: string
                required:
                  - kind
                  - name
                type: object
          description: The caller already holds this guest session.
        "201":
          content:
            application/json:
              schema:
                properties:
                  kind:
                    enum:
                      - guest
                    type: string
                  name:
                    pattern: ^Guest [a-z0-9]{4}$
                    type: string
                required:
                  - kind
                  - name
                type: object
          description: A fresh guest session; the session cookie is set.
        "409":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - signed_in
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: A user is signed in; a guest session never replaces an account.
        "429":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - guest_limit
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The global guest cap is full.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; 60.
              schema:
                minimum: 1
                type: integer
      security:
        - sessionCookie: []
        - {}
      summary: Start an anonymous guest session.
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: "Idempotent: without a live session it still clears the cookie and answers 204. Ending
        a guest session aborts its live games, which were unrated anyway."
      operationId: logout
      responses:
        "204":
          description: The session is gone and the cookie cleared.
      security:
        - sessionCookie: []
        - {}
      summary: "Sign out: end the session and clear its cookie."
      tags:
        - Auth
  /api/bot/account:
    get:
      description: The bot's name, its Glicko-2 rating in whole points, provisional while the deviation is
        above 75, and the declaration as stored.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  about:
                    maxLength: 280
                    type: string
                  accepts:
                    properties:
                      match:
                        type: boolean
                      turnMs:
                        items:
                          type: integer
                        maxItems: 2
                        minItems: 2
                        nullable: true
                        type: array
                      unlimited:
                        type: boolean
                    required:
                      - turnMs
                      - match
                      - unlimited
                    type: object
                  name:
                    type: string
                  provisional:
                    type: boolean
                  rating:
                    type: integer
                  repoUrl:
                    anyOf:
                      - format: uri
                        maxLength: 2048
                        type: string
                      - enum:
                          - ""
                        type: string
                  version:
                    maxLength: 64
                    type: string
                required:
                  - name
                  - rating
                  - provisional
                type: object
          description: The account as it stands now.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned; the token answers this until the ban lifts, and dies then.
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: "Only the process holding the token may promise behaviour, which is why this is the
        bot's surface and not the owner's. Every field is optional; each present field replaces the
        stored one, an empty string clears a text field, and accepts replaces wholesale. The
        declaration narrows open=1: a challenge outside accepts is answered not-open."
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                about:
                  maxLength: 280
                  type: string
                accepts:
                  properties:
                    match:
                      type: boolean
                    turnMs:
                      items:
                        type: integer
                      maxItems: 2
                      minItems: 2
                      nullable: true
                      type: array
                    unlimited:
                      type: boolean
                  required:
                    - turnMs
                    - match
                    - unlimited
                  type: object
                repoUrl:
                  anyOf:
                    - format: uri
                      maxLength: 2048
                      type: string
                    - enum:
                        - ""
                      type: string
                version:
                  maxLength: 64
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  about:
                    maxLength: 280
                    type: string
                  accepts:
                    properties:
                      match:
                        type: boolean
                      turnMs:
                        items:
                          type: integer
                        maxItems: 2
                        minItems: 2
                        nullable: true
                        type: array
                      unlimited:
                        type: boolean
                    required:
                      - turnMs
                      - match
                      - unlimited
                    type: object
                  name:
                    type: string
                  provisional:
                    type: boolean
                  rating:
                    type: integer
                  repoUrl:
                    anyOf:
                      - format: uri
                        maxLength: 2048
                        type: string
                      - enum:
                          - ""
                        type: string
                  version:
                    maxLength: 64
                    type: string
                required:
                  - name
                  - rating
                  - provisional
                type: object
          description: The account as it stands now, the stored declaration included.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The request fails validation.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned; the token answers this until the ban lifts, and dies then.
      security:
        - bearerAuth: []
      summary: Declare the bot's about, version, repo, and what it accepts.
      tags:
        - Account
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: "Only the challenged bot may accept. The one gate that can have moved since creation is
        re-checked: if the target is now at its concurrent-game cap the answer is bot_busy and the
        challenge stays pending. On acceptance a normal game starts with both sides driven through
        their engine sessions, colors per firstPlayer, and both bots receive a gameStart line; the
        game lands in the same log as human games."
      operationId: acceptChallenge
      parameters:
        - description: The challenge, as carried on its challenge line.
          in: path
          name: challengeId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    enum:
                      - true
                    type: boolean
                required:
                  - ok
                type: object
          description: Accepted; the game arrives as gameStart on both streams.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                      - bot_busy
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The target is at its concurrent-game cap (bot_busy); the challenge stays pending.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned; the token answers this until the ban lifts, and dies then.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - paused
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: "The site is paused: nothing new starts, while open streams and live games run on.
            Retry after the advertised delay."
          headers:
            Retry-After:
              description: Seconds to wait before retrying; 60 while paused.
              schema:
                minimum: 1
                type: integer
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel. The target learns of it as a challengeCanceled line
        with reason canceled; expiry carries reason expired and reaches both sides.
      operationId: cancelChallenge
      parameters:
        - description: The challenge, as carried on its challenge line.
          in: path
          name: challengeId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    enum:
                      - true
                    type: boolean
                required:
                  - ok
                type: object
          description: Canceled.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned; the token answers this until the ban lifts, and dies then.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline. The challenger learns of it as a challengeDeclined
        line on its stream.
      operationId: declineChallenge
      parameters:
        - description: The challenge, as carried on its challenge line.
          in: path
          name: challengeId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    enum:
                      - true
                    type: boolean
                required:
                  - ok
                type: object
          description: Declined.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The bot's owner is banned; the token answers this until the ban lifts, and dies then.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: "Bot to bot. The target is named by its global name and must be online with open=1 and
        inside what it declared itself willing to play; a challenge outside accepts answers
        clock_not_accepted exactly like the human surface. firstPlayer names who takes the first
        player turn (the origin stone is automatic, so the first turn is the first thing a player
        does); random draws at accept. The challenger's owner may not own the target (own_bot), both
        sides must be under their concurrent-game caps, the target's pending inbox holds at most 10,
        and daily caps bound bot-vs-bot games: 20 per pair and 100 per bot, counted over UTC days
        from the game log. A challenge lives 60 s, then expires and reaches both sides as
        challengeCanceled. Creation is idempotent on requestId, scoped to the challenger: resending
        the same id answers 200 with the stored challenge and whatever status it reached, never a
        second inbox entry."
      operationId: createChallenge
      parameters:
        - description: The challenged bot, by its globally unique name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingTurns:
                  default: 1
                  maximum: 4
                  minimum: 0
                  type: integer
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  oneOf:
                    - properties:
                        mode:
                          enum:
                            - unlimited
                          type: string
                      required:
                        - mode
                      type: object
                    - properties:
                        mode:
                          enum:
                            - turn
                          type: string
                        turnTimeMs:
                          minimum: 5000
                          type: integer
                      required:
                        - mode
                        - turnTimeMs
                      type: object
                    - properties:
                        incrementMs:
                          minimum: 0
                          type: integer
                        mainTimeMs:
                          minimum: 60000
                          type: integer
                        mode:
                          enum:
                            - match
                          type: string
                      required:
                        - mode
                        - mainTimeMs
                        - incrementMs
                      type: object
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  challengeId:
                    type: string
                  challenger:
                    properties:
                      name:
                        type: string
                      provisional:
                        type: boolean
                      rating:
                        type: integer
                    required:
                      - name
                      - rating
                      - provisional
                    type: object
                  destUser:
                    properties:
                      name:
                        type: string
                      provisional:
                        type: boolean
                      rating:
                        type: integer
                    required:
                      - name
                      - rating
                      - provisional
                    type: object
                  firstPlayer:
                    enum:
                      - challenger
                      - challenged
                      - random
                    type: string
                  openingTurns:
                    maximum: 4
                    minimum: 0
                    type: integer
                  status:
                    enum:
                      - created
                      - accepted
                      - declined
                      - canceled
                      - expired
                    type: string
                  timeControl:
                    oneOf:
                      - properties:
                          mode:
                            enum:
                              - unlimited
                            type: string
                        required:
                          - mode
                        type: object
                      - properties:
                          mode:
                            enum:
                              - turn
                            type: string
                          turnTimeMs:
                            minimum: 5000
                            type: integer
                        required:
                          - mode
                          - turnTimeMs
                        type: object
                      - properties:
                          incrementMs:
                            minimum: 0
                            type: integer
                          mainTimeMs:
                            minimum: 60000
                            type: integer
                          mode:
                            enum:
                              - match
                            type: string
                        required:
                          - mode
                          - mainTimeMs
                          - incrementMs
                        type: object
                required:
                  - challengeId
                  - challenger
                  - destUser
                  - timeControl
                  - openingTurns
                  - firstPlayer
                  - status
                type: object
          description: The requestId is known; the stored challenge, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                properties:
                  challengeId:
                    type: string
                  challenger:
                    properties:
                      name:
                        type: string
                      provisional:
                        type: boolean
                      rating:
                        type: integer
                    required:
                      - name
                      - rating
                      - provisional
                    type: object
                  destUser:
                    properties:
                      name:
                        type: string
                      provisional:
                        type: boolean
                      rating:
                        type: integer
                    required:
                      - name
                      - rating
                      - provisional
                    type: object
                  firstPlayer:
                    enum:
                      - challenger
                      - challenged
                      - random
                    type: string
                  openingTurns:
                    maximum: 4
                    minimum: 0
                    type: integer
                  status:
                    enum:
                      - created
                      - accepted
                      - declined
                      - canceled
                      - expired
                    type: string
                  timeControl:
                    oneOf:
                      - properties:
                          mode:
                            enum:
                              - unlimited
                            type: string
                        required:
                          - mode
                        type: object
                      - properties:
                          mode:
                            enum:
                              - turn
                            type: string
                          turnTimeMs:
                            minimum: 5000
                            type: integer
                        required:
                          - mode
                          - turnTimeMs
                        type: object
                      - properties:
                          incrementMs:
                            minimum: 0
                            type: integer
                          mainTimeMs:
                            minimum: 60000
                            type: integer
                          mode:
                            enum:
                              - match
                            type: string
                        required:
                          - mode
                          - mainTimeMs
                          - incrementMs
                        type: object
                required:
                  - challengeId
                  - challenger
                  - destUser
                  - timeControl
                  - openingTurns
                  - firstPlayer
                  - status
                type: object
          description: The challenge exists and waits in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_request
                      - not_open
                      - clock_not_accepted
                      - bot_busy
                      - inbox_full
                      - daily_pair_cap
                      - daily_bot_cap
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: "Validation failed, or a gate refused: the target is not taking games (not_open),
            declines this clock (clock_not_accepted), a side is at its concurrent-game cap
            (bot_busy), the target's inbox is full (inbox_full), the pair hit its daily cap
            (daily_pair_cap), or a bot hit its daily bot-vs-bot cap (daily_bot_cap)."
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Missing, unknown, or rotated token.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - banned
                      - own_bot
                      - delisted
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The challenger's owner also owns the target (own_bot), either bot is delisted
            (delisted), or the challenger's owner is banned (banned).
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - paused
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: "The site is paused: nothing new starts, while open streams and live games run on.
            Retry after the advertised delay."
          headers:
            Retry-After:
              description: Seconds to wait before retrying; 60 while paused.
              schema:
                minimum: 1
                type: integer
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The same short-lived per-game token the websocket takes, presented as a bearer header;
        resignation needs no live socket, so the websocket stays strictly htttx packets.
      operationId: resignBotGame
      parameters:
        - description: The game, as carried on gameStart and moveRequest.
          in: path
          name: gameId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
