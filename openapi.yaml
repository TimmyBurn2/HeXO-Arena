components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        minimum: 1
        type: integer
  parameters:
    BotName:
      description: The bot's name.
      in: path
      name: name
      required: true
      schema:
        type: string
    ChallengeId:
      description: The challenge, as carried on its challenge line.
      in: path
      name: challengeId
      required: true
      schema:
        type: string
    GameId:
      description: The game, as carried on gameStart and moveRequest.
      in: path
      name: gameId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
      description: The request fails validation.
    Banned:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannedError"
      description: The bot's owner is banned; after the ban lifts, the owner must rotate the token.
    BotUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: Missing, unknown, or rotated bot token.
    Delisted:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DelistedError"
      description: The bot is delisted and takes no new games.
    GameOver:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameOverError"
      description: The game is already finished (game_over).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
      description: The target does not exist or is not the caller's to act on.
    OAuthUnconfigured:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthUnconfiguredError"
      description: Discord OAuth credentials are not configured.
    Paused:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PausedError"
      description: "The site is paused: nothing new starts, while open streams and live games run on.
        Retry after 60 s."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: No session cookie, or the session is expired or unknown.
  schemas:
    Accepts:
      description: The clocks the bot agrees to play.
      properties:
        match:
          type: boolean
        turnMs:
          description: The accepted turn time window [min, max] in milliseconds, or null for none.
          items:
            type: integer
          maxItems: 2
          minItems: 2
          nullable: true
          type: array
        unlimited:
          type: boolean
      required:
        - turnMs
        - match
        - unlimited
      type: object
    Account:
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - rating
        - provisional
      type: object
    AccountDeclaration:
      additionalProperties: false
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      type: object
    BadRequestError:
      properties:
        code:
          enum:
            - bad_request
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BadStateError:
      properties:
        code:
          enum:
            - bad_state
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BannedError:
      properties:
        code:
          enum:
            - banned
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Board:
      properties:
        cells:
          items:
            properties:
              p:
                enum:
                  - x
                  - o
                type: string
              q:
                type: integer
              r:
                type: integer
            required:
              - q
              - r
              - p
            type: object
          type: array
        to_move:
          enum:
            - x
            - o
          type: string
      required:
        - to_move
        - cells
      type: object
    BotLimitError:
      properties:
        code:
          enum:
            - bot_limit
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotListing:
      description: The declaration fields are absent until the bot declares them.
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        name:
          type: string
        online:
          description: True while the bot holds its stream open.
          type: boolean
        openForChallenges:
          description: True while the bot holds its stream open with open=1.
          type: boolean
        ownerName:
          nullable: true
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - ownerName
        - online
        - openForChallenges
        - rating
        - provisional
      type: object
    BotNameError:
      properties:
        code:
          enum:
            - invalid_name
            - name_reserved
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotToken:
      properties:
        name:
          type: string
        token:
          pattern: ^hxo_[A-Za-z0-9_-]{43}$
          type: string
      required:
        - name
        - token
      type: object
    Challenge:
      description: firstPlayer names who plays turn (openingPlies + 1) / 2, the first turn after the
        opening. A random firstPlayer is drawn at acceptance.
      properties:
        challengeId:
          type: string
        challenger:
          $ref: "#/components/schemas/Player"
        destUser:
          $ref: "#/components/schemas/Player"
        firstPlayer:
          enum:
            - challenger
            - challenged
            - random
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        status:
          enum:
            - created
            - accepted
            - declined
            - canceled
            - expired
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
      required:
        - challengeId
        - challenger
        - destUser
        - timeControl
        - openingPlies
        - firstPlayer
        - status
      type: object
    ChallengeAcceptError:
      properties:
        code:
          enum:
            - bad_request
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCanceledEvent:
      description: A cancel reaches the target with reason canceled; an expiry reaches both sides with
        reason expired.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        reason:
          enum:
            - canceled
            - expired
          type: string
        type:
          enum:
            - challengeCanceled
          type: string
      required:
        - type
        - reason
        - challenge
      type: object
    ChallengeCreateError:
      properties:
        code:
          enum:
            - bad_request
            - not_open
            - clock_not_accepted
            - bot_busy
            - inbox_full
            - daily_pair_cap
            - daily_bot_cap
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCreatedEvent:
      description: A pending challenge for the bot, sent on creation and replayed as the stream opens.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challenge
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeDeclinedEvent:
      description: The target declined; sent to the challenger.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challengeDeclined
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeForbiddenError:
      properties:
        code:
          enum:
            - banned
            - own_bot
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    DelistedError:
      properties:
        code:
          enum:
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    DiscordError:
      properties:
        code:
          enum:
            - discord_error
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    EngineSession:
      properties:
        socketUrl:
          description: The engine-session websocket, origin-relative.
          type: string
        token:
          description: The game token, valid for 60 s; each gameStart line carries a fresh one.
          type: string
      required:
        - socketUrl
        - token
      type: object
    FinishReason:
      enum:
        - aborted
        - disconnect
        - surrender
        - timeout
        - terminated
        - six-in-a-row
      type: string
    GameBoard:
      properties:
        cells:
          items:
            properties:
              side:
                enum:
                  - x
                  - o
                type: string
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
              - side
            type: object
          type: array
      required:
        - cells
      type: object
    GameClock:
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            remainingTurnMs:
              minimum: 0
              type: integer
          required:
            - mode
            - remainingTurnMs
          type: object
        - properties:
            mode:
              enum:
                - match
              type: string
            remainingMainMs:
              properties:
                o:
                  minimum: 0
                  type: integer
                x:
                  minimum: 0
                  type: integer
              required:
                - x
                - o
              type: object
          required:
            - mode
            - remainingMainMs
          type: object
    GameCreateError:
      properties:
        code:
          enum:
            - bad_request
            - human_busy
            - game_cooldown
            - not_open
            - clock_not_accepted
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GameEvent:
      description: "One server-sent event: the event field names the kind, and the data field holds the
        payload as one line of JSON."
      oneOf:
        - properties:
            data:
              $ref: "#/components/schemas/GameSnapshot"
            event:
              enum:
                - snapshot
              type: string
          required:
            - event
            - data
          type: object
        - properties:
            data:
              $ref: "#/components/schemas/GameTurn"
            event:
              enum:
                - turn
              type: string
          required:
            - event
            - data
          type: object
        - properties:
            data:
              $ref: "#/components/schemas/GameFinish"
            event:
              enum:
                - finish
              type: string
          required:
            - event
            - data
          type: object
    GameFinish:
      description: The result, with the clock as it stood at the end.
      properties:
        clock:
          $ref: "#/components/schemas/GameClock"
        reason:
          $ref: "#/components/schemas/FinishReason"
        winner:
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - winner
        - reason
        - clock
      type: object
    GameFinishEvent:
      properties:
        gameId:
          type: string
        reason:
          $ref: "#/components/schemas/FinishReason"
        type:
          enum:
            - gameFinish
          type: string
        winner:
          description: Null after an abort, a termination, or a disconnect that left neither side connected.
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - type
        - gameId
        - winner
        - reason
      type: object
    GameOverError:
      properties:
        code:
          enum:
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GamePlayer:
      properties:
        kind:
          enum:
            - bot
            - user
            - guest
          type: string
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
            - nullable: true
      required:
        - name
        - rating
        - provisional
        - kind
      type: object
    GamePlayers:
      properties:
        o:
          $ref: "#/components/schemas/GamePlayer"
        x:
          $ref: "#/components/schemas/GamePlayer"
      required:
        - x
        - o
      type: object
    GameSnapshot:
      description: you is the caller's side, present exactly when the caller holds a seat. board.cells
        lists stones in ply order, so its first openingPlies entries are the opening.
      oneOf:
        - properties:
            board:
              $ref: "#/components/schemas/GameBoard"
            clock:
              $ref: "#/components/schemas/GameClock"
            gameId:
              type: string
            openingPlies:
              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            status:
              enum:
                - in-progress
              type: string
            toMove:
              enum:
                - x
                - o
              type: string
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - status
            - toMove
            - clock
          type: object
        - properties:
            board:
              $ref: "#/components/schemas/GameBoard"
            clock:
              $ref: "#/components/schemas/GameClock"
            gameId:
              type: string
            openingPlies:
              $ref: "#/components/schemas/OpeningPlies"
            players:
              $ref: "#/components/schemas/GamePlayers"
            reason:
              $ref: "#/components/schemas/FinishReason"
            status:
              enum:
                - finished
              type: string
            winner:
              enum:
                - x
                - o
                - null
              nullable: true
              type: string
            you:
              enum:
                - x
                - o
              type: string
          required:
            - gameId
            - players
            - openingPlies
            - board
            - status
            - winner
            - reason
          type: object
    GameStartEvent:
      description: A game the bot plays has started, or is replayed as the stream opens.
      properties:
        engine:
          $ref: "#/components/schemas/EngineSession"
        gameId:
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        opponent:
          $ref: "#/components/schemas/Seat"
        rated:
          description: False for a game against a guest, which moves no rating.
          type: boolean
        side:
          enum:
            - x
            - o
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        type:
          enum:
            - gameStart
          type: string
      required:
        - type
        - gameId
        - side
        - opponent
        - timeControl
        - openingPlies
        - rated
        - engine
      type: object
    GameTurn:
      description: One applied turn, numbered from turn 0 at the origin. cells holds its stones in order;
        a turn whose first stone wins holds that stone alone. toMove and clock are the game's state
        once the turn lands.
      properties:
        cells:
          items:
            properties:
              x:
                type: integer
              y:
                type: integer
            required:
              - x
              - y
            type: object
          maxItems: 2
          minItems: 1
          type: array
        clock:
          $ref: "#/components/schemas/GameClock"
        side:
          enum:
            - x
            - o
          type: string
        toMove:
          enum:
            - x
            - o
          type: string
        turn:
          minimum: 1
          type: integer
      required:
        - turn
        - side
        - cells
        - toMove
        - clock
      type: object
    Guest:
      properties:
        kind:
          enum:
            - guest
          type: string
        name:
          pattern: ^Guest [a-z0-9]{4}$
          type: string
      required:
        - kind
        - name
      type: object
    GuestLimitError:
      properties:
        code:
          enum:
            - guest_limit
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    InGameError:
      properties:
        code:
          enum:
            - in_game
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    LeaderboardEntry:
      properties:
        kind:
          enum:
            - bot
            - human
          type: string
        name:
          type: string
        rank:
          description: The position on the filtered board.
          minimum: 1
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - rank
        - name
        - kind
        - rating
      type: object
    LiveGameEntry:
      description: A game in progress; a game with a guest seat is unrated.
      properties:
        gameId:
          type: string
        players:
          $ref: "#/components/schemas/GamePlayers"
        plies:
          description: Stones on the board, the opening included.
          minimum: 1
          type: integer
        rated:
          type: boolean
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        toMove:
          enum:
            - x
            - o
          type: string
      required:
        - gameId
        - players
        - timeControl
        - toMove
        - rated
        - plies
      type: object
    MoveError:
      properties:
        code:
          enum:
            - bad_request
            - not_your_turn
            - cell_occupied
            - out_of_range
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    MoveRequest:
      properties:
        board:
          $ref: "#/components/schemas/Board"
        request_id:
          minimum: 0
          type: integer
        time_limit:
          minimum: 0
          type: number
      required:
        - board
      type: object
    MoveRequestEvent:
      description: Follows a replayed gameStart when it is the bot's turn; live turns arrive on the engine
        session.
      properties:
        gameId:
          type: string
        request:
          $ref: "#/components/schemas/MoveRequest"
        type:
          enum:
            - moveRequest
          type: string
      required:
        - type
        - gameId
        - request
      type: object
    NameTakenError:
      properties:
        code:
          enum:
            - name_taken
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    NotFoundError:
      properties:
        code:
          enum:
            - not_found
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    OAuthUnconfiguredError:
      properties:
        code:
          enum:
            - oauth_unconfigured
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Ok:
      properties:
        ok:
          enum:
            - true
          type: boolean
      required:
        - ok
      type: object
    OpeningPlies:
      description: Stones the server places before either player acts, the origin at (0, 0) included. A
        ply is one stone; turn 0 is the origin, and turn t >= 1 is plies 2t-1 and 2t. Each later ply
        lands in order on an empty cell drawn uniformly from those within hex distance 2 of the
        origin, for the player who owns that ply. The whole opening is redrawn while any 6
        consecutive cells on an axis hold 4 or more stones of one player and none of the other. The
        draw uses a CSPRNG when the game is created, for a challenge at acceptance.
      enum:
        - 1
        - 3
        - 5
        - 7
        - 9
      type: integer
    PausedError:
      properties:
        code:
          enum:
            - paused
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Player:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - name
        - rating
        - provisional
      type: object
    Provisional:
      description: True while the rating deviation is above 75.
      type: boolean
    Rating:
      description: The Glicko-2 rating, rounded to a whole point.
      type: integer
    Seat:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
            - nullable: true
      required:
        - name
        - rating
        - provisional
      type: object
    SignedInError:
      properties:
        code:
          enum:
            - signed_in
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    StreamEvent:
      discriminator:
        mapping:
          challenge: "#/components/schemas/ChallengeCreatedEvent"
          challengeCanceled: "#/components/schemas/ChallengeCanceledEvent"
          challengeDeclined: "#/components/schemas/ChallengeDeclinedEvent"
          gameFinish: "#/components/schemas/GameFinishEvent"
          gameStart: "#/components/schemas/GameStartEvent"
          moveRequest: "#/components/schemas/MoveRequestEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/GameStartEvent"
        - $ref: "#/components/schemas/MoveRequestEvent"
        - $ref: "#/components/schemas/GameFinishEvent"
        - $ref: "#/components/schemas/ChallengeCreatedEvent"
        - $ref: "#/components/schemas/ChallengeCanceledEvent"
        - $ref: "#/components/schemas/ChallengeDeclinedEvent"
    TimeControl:
      description: Durations are in milliseconds.
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            turnTimeMs:
              minimum: 5000
              type: integer
          required:
            - mode
            - turnTimeMs
          type: object
        - properties:
            incrementMs:
              minimum: 0
              type: integer
            mainTimeMs:
              minimum: 60000
              type: integer
            mode:
              enum:
                - match
              type: string
          required:
            - mode
            - mainTimeMs
            - incrementMs
          type: object
    UnauthorizedError:
      properties:
        code:
          enum:
            - unauthorized
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    User:
      properties:
        kind:
          enum:
            - user
          type: string
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - kind
        - name
        - rating
        - provisional
      type: object
    WatcherLimitError:
      properties:
        code:
          enum:
            - watcher_limit
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: A bot token (hxo_...), minted and rotated by the owner on the website.
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: A game token (hgs_...) from a gameStart line.
      scheme: bearer
      type: http
    sessionCookie:
      description: An HttpOnly session cookie, set by the Discord OAuth callback or the guest route.
      in: cookie
      name: hexo_arena_session
      type: apiKey
info:
  title: HeXO Arena
  version: 0.19.0
openapi: 3.0.3
paths:
  /api/auth/discord/callback:
    get:
      description: "Requests the identify scope only: the Discord id and username."
      operationId: discordCallback
      responses:
        "302":
          description: The session cookie is set; redirect to /.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadStateError"
          description: The state is unknown, expired, or already used.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannedError"
          description: The Discord identity belongs to a banned user; no session is created.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordError"
          description: Discord rejected the code or the identity lookup failed.
        "503":
          $ref: "#/components/responses/OAuthUnconfigured"
      summary: "Finish Discord OAuth: create the session."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Each redirect carries a fresh state and nonce, valid once at the callback.
      operationId: discordLogin
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint.
        "503":
          $ref: "#/components/responses/OAuthUnconfigured"
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/auth/guest:
    post:
      description: The session lives in server memory only and ends at sign-out, a Discord sign-in, or a
        restart. It also ends after 24 h without a request, unless it sits in a live game. Every
        guest game is unrated.
      operationId: startGuest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: The caller already holds this guest session.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: A new guest session; the session cookie is set.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInError"
          description: A user is signed in.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLimitError"
          description: The global guest cap is full; retry after 60 s.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Start an anonymous guest session.
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: "Idempotent: without a live session it still clears the cookie. Ending a guest session
        aborts its live games."
      operationId: logout
      responses:
        "204":
          description: The session is gone and the cookie cleared.
      security:
        - sessionCookie: []
        - {}
      summary: "Sign out: end the session and clear its cookie."
      tags:
        - Auth
  /api/bot/account:
    get:
      description: The bot's name, rating, and stored declaration.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: Each present field replaces the stored one; an empty string clears a text field, and
        accepts is replaced whole. An unknown key answers 400. A challenge or game outside accepts
        answers clock_not_accepted.
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeclaration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account after the update.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
      security:
        - bearerAuth: []
      summary: Declare the bot's about, version, repo, and what it accepts.
      tags:
        - Account
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: Only the challenged bot may accept. The game starts at once, and both bots receive gameStart.
      operationId: acceptChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptError"
          description: The challenged bot is at its game cap (bot_busy); the challenge stays pending.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel; the target receives challengeCanceled.
      operationId: cancelChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Canceled.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline; the challenger receives challengeDeclined.
      operationId: declineChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Declined.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: The target must hold its stream open with open=1 and accept the clock. A bot plays at
        most 4 games at once. Per UTC day, a bot plays at most 100 bot-vs-bot games, and a pair 20.
        The target holds at most 10 pending challenges. A challenge expires after 60 s. Resending a
        requestId answers 200 with the stored challenge.
      operationId: createChallenge
      parameters:
        - description: The challenged bot's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The stored challenge for a known requestId, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The challenge, pending in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateError"
          description: Validation failed (bad_request), the target is not open (not_open) or excludes the
            clock (clock_not_accepted), a side is at its game cap (bot_busy), the target's inbox is
            full (inbox_full), or the pair (daily_pair_cap) or a bot (daily_bot_cap) is at its daily
            cap.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeForbiddenError"
          description: The challenger's owner owns the target (own_bot), either bot is delisted (delisted), or
            the challenger's owner is banned (banned).
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender; no engine session is needed.
      operationId: resignBotGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Resigned.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or rotated game token.
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - gameToken: []
      summary: Resign a game over the engine-session token.
      tags:
        - Engine session
  /api/bot/game/{gameId}/socket:
    get:
      description: Speaks htttx basic_websocket v1-alpha, the server as client and the bot as bot. The bot
        must support the move_skips and request_id capabilities. A new connection replaces the
        previous one. Each move_request lists in previous only the turns this connection has not
        seen. Heartbeats come every 10 s. A move_response must echo request_id, or it is dropped. An
        illegal move forfeits.
      operationId: openEngineSession
      parameters:
        - $ref: "#/components/parameters/GameId"
        - description: The game token from the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching protocols; the engine session is open.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: Unknown game, or a game token that is expired or rotated.
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: One StreamEvent per line, with a bare newline as keepalive every 10 s. Opening a stream
        closes the bot's previous one. The bot is online while its stream is open. On open, each
        active game replays as gameStart, followed by moveRequest on the bot's turn. Play runs on
        the engine session that gameStart hands out.
      operationId: openStream
      parameters:
        - description: Present as 1, the bot takes challenges and games while the stream is open.
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamEvent"
          description: The event stream, as NDJSON.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The listed roster, ordered by name fold, without pagination. Delisted bots and bots of
        banned owners are hidden.
      operationId: listBots
      parameters:
        - description: Present as 1, narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BotListing"
                type: array
          description: The roster.
        "400":
          $ref: "#/components/responses/BadRequest"
      security: []
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the bot's token; this response is its only appearance. Names share one global
        namespace with users and never change.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its token.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotNameError"
          description: The name fails the name syntax or is reserved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLimitError"
          description: The owner already holds 3 bots.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameTakenError"
          description: The name fold is taken by a user or a bot.
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}:
    delete:
      description: "A bot with rated games is anonymized: it becomes a deleted-<n> placeholder, its games
        and ratings stay, and its name stays reserved. A bot without rated games is deleted and its
        name freed."
      operationId: deleteBot
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "204":
          description: The bot and its token are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGameError"
          description: The bot is seated in a live game.
      security:
        - sessionCookie: []
      summary: Delete a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}/token:
    post:
      description: The previous token stops working at once.
      operationId: rotateBotToken
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its new token, shown only here.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - sessionCookie: []
      summary: Rotate a bot token.
      tags:
        - Bots
  /api/games:
    get:
      description: Games in progress, newest first, at most 12, without pagination. Guest games are
        listed; finished games never are.
      operationId: listLiveGames
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LiveGameEntry"
                type: array
          description: The live games.
      security: []
      summary: List live games.
      tags:
        - Games
    post:
      description: The bot must hold its stream open with open=1, have fewer than 4 live games, and accept
        the clock. The caller, a user or guest, may hold 3 live games and create one every 60 s. The
        server draws sides and places the opening; the bot receives gameStart. A game against a
        guest is unrated.
      operationId: createGame
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bot:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - bot
                - timeControl
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The new game's snapshot.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCreateError"
          description: Validation failed (bad_request), the caller is at its live-game cap (human_busy) or
            inside the creation cooldown (game_cooldown), or the bot is not open (not_open),
            excludes the clock (clock_not_accepted), or is at its game cap (bot_busy).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Delisted"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Start a game against a bot.
      tags:
        - Games
  /api/games/{gameId}:
    get:
      description: Board, turn, and clock in one read; a finished game carries its result. Anyone may read
        a game, a guest's while the guest's session lives.
      operationId: getGameSnapshot
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The game's snapshot.
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - sessionCookie: []
        - {}
      summary: Read any game.
      tags:
        - Games
  /api/games/{gameId}/events:
    get:
      description: "Server-sent events: on open a snapshot, then a turn event per applied turn, then a
        finish event, and the stream closes. A finished game sends its snapshot and closes. A
        comment line comes every 10 s. Events carry no ids and nothing replays: a reconnect gets a
        fresh snapshot."
      operationId: watchGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GameEvent"
          description: The event stream.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherLimitError"
          description: Watchers without a seat are capped at 50 per game and 500 in total; retry after 30 s. A
            seated caller is never refused.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Watch a game live.
      tags:
        - Games
  /api/games/{gameId}/move:
    post:
      description: Places both stones of the caller's turn. A win on the first placement ends the game,
        and the second is not applied. An illegal move answers 400 and forfeits nothing.
      operationId: playHumanMove
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cells:
                  items:
                    properties:
                      x:
                        type: integer
                      y:
                        type: integer
                    required:
                      - x
                      - y
                    type: object
                  type: array
              required:
                - cells
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The snapshot after the move.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveError"
          description: Validation failed (bad_request), it is not the caller's turn (not_your_turn), a cell is
            taken (cell_occupied) or out of range (out_of_range), or the game is over (game_over).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - sessionCookie: []
      summary: Play the two placements of the caller's turn.
      tags:
        - Games
  /api/games/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender.
      operationId: resignHumanGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The finished snapshot.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - sessionCookie: []
      summary: Resign a game the caller plays in.
      tags:
        - Games
  /api/leaderboard:
    get:
      description: Rankable players, highest rating first, ties by name fold, without pagination. A player
        is rankable at a rating deviation of 75 or below. Banned users, delisted bots, and bots of
        banned owners never appear. Bots and humans share one rating pool.
      operationId: getLeaderboard
      parameters:
        - description: Narrows the board to bots or humans; all when absent.
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bots
              - humans
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
                type: array
          description: The board.
        "400":
          $ref: "#/components/responses/BadRequest"
      security: []
      summary: List rankable players by rating.
      tags:
        - Directory
  /api/me:
    get:
      description: Reads the session cookie alone; without a live session the answer is null, never 401.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/Guest"
                  - nullable: true
          description: The session's user or guest, or null.
      security:
        - sessionCookie: []
        - {}
      summary: Who the session names.
      tags:
        - Auth
  /healthz:
    get:
      responses:
        "200":
          description: The process is up and serving.
        "503":
          description: The process is up and paused.
      summary: Liveness probe.
