            the weekly it entered beginning (tournament), or it or its owner taken out (banned,
            delisted, deleted). A duel kept from the duels of old may also have been cut short with
            a bot offline, connected but not open (closed), outside its clocks (clock), or at its
            game cap (busy) for the whole grace, a rated game at a daily cap (daily_cap), or a game
            aborted (aborted)."
          enum:
