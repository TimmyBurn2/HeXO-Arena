          minimum: 0
          type: integer
        unratedByChoice:
          $ref: "#/components/schemas/UnratedByChoice"
        voided:
          description: "Taken out by the operator: still listed, and counted in no record and no rating."
          type: boolean
        winner:
          enum:
            - x
            - o
            - null
          nullable: true
          type: string
      required:
        - gameId
        - players
        - winner
        - reason
        - timeControl
        - openingPlies
        - turns
        - finishedAt
        - rated
        - voided
        - analyses
