components:
  parameters: {}
  schemas: {}
  securitySchemes:
    sessionCookie:
      description: A browser session, set by the Discord OAuth callback and readable only by the server.
      in: cookie
      name: hexarena_session
      type: apiKey
info:
  title: hexarena
  version: 0.2.0
openapi: 3.0.3
paths:
  /api/auth/discord/callback:
    get:
      description: "Identify scope only: the Discord id and username, never an email. On success sets the
        session cookie and redirects to the app root."
      operationId: discordCallback
      responses:
        "302":
          description: Session cookie set; redirect to /.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bad_state
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The state is unknown, expired, or already used.
        "502":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - discord_error
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord rejected the code or the identity lookup failed.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Finish Discord OAuth: create the session."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Mandatory state and nonce, generated per redirect and validated once at the callback.
      operationId: discordLogin
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint.
        "503":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - oauth_unconfigured
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Discord OAuth credentials are not configured.
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/bots:
    get:
      description: The whole roster, ordered by name fold; hobby scale, no pagination yet.
      operationId: listBots
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    name:
                      type: string
                    ownerName:
                      nullable: true
                      type: string
                  required:
                    - name
                    - ownerName
                  type: object
                type: array
          description: The bot roster.
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the token exactly once; this response is the only place it ever appears in the
        clear. Names share one global namespace with users and are immutable.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                  token:
                    pattern: ^hxo_[A-Za-z0-9_-]{43}$
                    type: string
                required:
                  - name
                  - token
                type: object
          description: The bot exists; the token will not be shown again.
        "400":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - invalid_name
                      - name_reserved
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fails the syntax rules or is reserved.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "403":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - bot_limit
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The owner already holds the per-user bot cap (3).
        "409":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - name_taken
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: The name fold is already taken, by a user or a bot.
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}:
    delete:
      operationId: deleteBot
      parameters:
        - description: "Targeting by name is unambiguous: names are immutable and fold-unique."
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The bot and its token are gone.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - sessionCookie: []
      summary: Delete a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}/token:
    post:
      description: The previous token dies immediately; the response carries the only appearance of the new one.
      operationId: rotateBotToken
      parameters:
        - description: "Targeting by name is unambiguous: names are immutable and fold-unique."
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  name:
                    type: string
                  token:
                    pattern: ^hxo_[A-Za-z0-9_-]{43}$
                    type: string
                required:
                  - name
                  - token
                type: object
          description: The fresh token, shown once.
        "401":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - unauthorized
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No session cookie, or the session is expired or unknown.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: No such bot, or one that is not the caller's to act on; the two are indistinguishable
            on purpose.
      security:
        - sessionCookie: []
      summary: Rotate a bot token.
      tags:
        - Bots
  /healthz:
    get:
      responses:
        "200":
          description: The process is up.
      summary: Liveness probe.
