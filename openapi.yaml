  /api/bot/game/{gameId}/socket:
    get:
      description: The htttx basic_websocket protocol with the server in the client role and the bot in
        the bot role. The token query parameter is the short-lived per-game token from gameStart;
        every gameStart replay rotates it, and one session per game is enforced, a fresh connection
        replacing a stale one. On open the server sends the setup packet (the origin stone) and a
        move_request whenever it is the bot's turn, with every stone placed since the origin carried
        in previous; heartbeats flow every 10 s. A move_response must echo the outstanding
        request_id; stale or mismatched answers are dropped, and an illegal move forfeits the game
        server-side.
      operationId: openEngineSession
      parameters:
        - description: The game, as carried on gameStart and moveRequest.
          in: path
          name: gameId
          required: true
          schema:
            type: string
        - description: The per-game token carried beside socketUrl on the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching protocols; the engine session is open.
        "404":
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - not_found
                    type: string
                  error:
                    type: string
                required:
                  - error
                  - code
                type: object
          description: Unknown game, or a token that is expired or rotated.
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: "One JSON object per line, with a bare newline as keepalive every 10 s. One stream per
