    CommunityAnalysis:
      description: A whole finished game read by a community analyzer on request; analyzer is null while
        none has taken it, and failure is present once it failed.
      properties:
        analysisId:
          type: string
        analyzer:
          allOf:
            - $ref: "#/components/schemas/AnalyzerRef"
            - nullable: true
        failedTurn:
          description: The turn whose position failed, when one did.
          minimum: 1
          type: integer
        failure:
          $ref: "#/components/schemas/AnalysisFailure"
        finishedAt:
          format: date-time
          nullable: true
          type: string
        involved:
          description: True when the analyzer's owner played in the game, as a human or through one of their
            bots, the analyzer itself included; set as the analyzer takes the game, never changed
            after, and false while none has.
          type: boolean
        kind:
          enum:
            - community
          type: string
        progress:
          description: Positions read, of those to read.
          properties:
            done:
              minimum: 0
              type: integer
            of:
              minimum: 0
              type: integer
          required:
            - done
            - of
          type: object
        queuePosition:
          description: Present while queued; 1 is next.
          minimum: 1
          type: integer
        requestedAt:
          format: date-time
          type: string
        seconds:
          description: Seconds each position is read for.
          maximum: 10
          minimum: 1
          type: integer
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        turns:
          description: Readings so far, in turn order, from the first turn after the opening.
          items:
            $ref: "#/components/schemas/AnalysisTurn"
          type: array
      required:
        - kind
        - analysisId
        - analyzer
        - involved
        - status
        - requestedAt
        - finishedAt
        - progress
        - seconds
        - turns
      type: object
    CreateTournamentRequest:
      additionalProperties: false
      description: "2 to 8 distinct bots: two play a duel, three or more a round robin. The clock is a
        turn clock of 5 to 60 s, or a match clock of 1 to 10 min plus 0 to 10 s, never unlimited. A
        1-ply opening allows a single game or one opening a pair, since a bot that plays alike every
        time would replay the bare origin identically."
      properties:
        bots:
          description: The bots in the order named; of two, the first named stands first.
          items:
            $ref: "#/components/schemas/TournamentPick"
          maxItems: 8
          minItems: 2
          type: array
        gamesPerPair:
          allOf:
            - $ref: "#/components/schemas/TournamentGamesPerPair"
            - default: 2
        openingPlies:
          allOf:
            - $ref: "#/components/schemas/OpeningPlies"
            - default: 5
        timeControl:
          $ref: "#/components/schemas/TimeControl"
      required:
        - bots
        - timeControl
      type: object
    DeleteAccountRequest:
