        - code
      type: object
    BotSettings:
      description: What a bot's owner decides for it on the website, apart from what the bot declares, and
        what only the owner sees.
      properties:
        about:
          description: The owner's text for the bot's pages, absent until set; it shows in place of the
            declared one.
          maxLength: 280
          type: string
        client:
          description: Absent until the bot opens its stream.
          oneOf:
            - properties:
                kind:
                  enum:
                    - hexo-bridge
                  type: string
                version:
                  pattern: ^\d{1,4}\.\d{1,4}\.\d{1,4}$
                  type: string
              required:
                - kind
                - version
              type: object
            - properties:
                kind:
                  enum:
                    - other
                  type: string
              required:
                - kind
              type: object
        declaredAbout:
          description: The text the bot declares, which shows while the owner has set none.
          maxLength: 280
          type: string
        declaredRepoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          description: The link the bot declares, which shows while the owner has set none.
        duelsByOthers:
          description: True lets any signed-in person set up a duel or round robin the bot plays; false keeps
            that to its owner, and takes the bot out of those others set up. On until the owner
            turns it off.
          type: boolean
        name:
          type: string
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          description: The owner's link to the bot's source, absent until set; it shows in place of the
            declared one.
      required:
