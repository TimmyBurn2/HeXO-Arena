          type: boolean
        round:
          description: While it runs, the round under way or the next to start, and how many there are; null
            otherwise.
          nullable: true
          properties:
            current:
              minimum: 1
              type: integer
            of:
              minimum: 1
              type: integer
          required:
            - current
            - of
          type: object
        startsAt:
          format: date-time
          type: string
        status:
          enum:
            - scheduled
            - running
            - finished
            - called_off
            - canceled
            - stopped
            - cut_short
          type: string
        test:
          type: boolean
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        winner:
          description: The bot first in the final standings, once finished.
          nullable: true
          properties:
            deleted:
              $ref: "#/components/schemas/Deleted"
            name:
              type: string
            ownerName:
              type: string
          required:
            - name
            - ownerName
          type: object
        yours:
          $ref: "#/components/schemas/TournamentYours"
      required:
        - id
        - name
        - origin
        - format
        - createdBy
        - rated
        - test
        - gamesPerPair
        - status
        - startsAt
        - timeControl
        - openingPlies
        - entrants
        - maxEntrants
        - winner
        - round
      type: object
    TournamentWaiting:
      description: A bot a game waits for, and when it is scored a no-show unless it is ready.
      properties:
        key:
          $ref: "#/components/schemas/TournamentKey"
        until:
          format: date-time
          type: string
      required:
        - key
        - until
      type: object
    TournamentWithdrawConflictError:
      properties:
        code:
          enum:
            - over
            - not_playing
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    TournamentWithdrawForbiddenError:
      properties:
        code:
          enum:
            - not_owner
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    TournamentWithdrawRequest:
      additionalProperties: false
      properties:
        bot:
          pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
          type: string
      required:
        - bot
      type: object
    TournamentYours:
      description: The caller's bot in the tournament and where it stands, the best placed where a round
        robin holds several; on the list of every bot alone.
      properties:
        bot:
          type: string
        deleted:
          $ref: "#/components/schemas/Deleted"
        place:
          $ref: "#/components/schemas/TournamentPlace"
      required:
        - bot
        - place
      type: object
    UnauthorizedError:
      properties:
        code:
          enum:
            - unauthorized
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    UnratedByChoice:
      description: "Present when the game was started unrated: a person's game at the bot's default level
        that they started unrated or that faces their own bot, a challenge between two bots of one
        owner, and every game of an unrated duel or round robin a person set up. It moves no rating
        and counts toward no daily cap."
      enum:
        - true
      type: boolean
    User:
      description: discord is null for a session made without Discord.
      properties:
        analysisLeft:
          $ref: "#/components/schemas/AnalysisLeft"
        analysisOptOut:
          description: True when the user asked that their games stay out of public analysis.
          type: boolean
        discord:
          allOf:
            - $ref: "#/components/schemas/DiscordNames"
            - nullable: true
        kind:
          enum:
            - user
          type: string
        liveGames:
          $ref: "#/components/schemas/OwnLiveGames"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - kind
        - name
        - rating
        - provisional
        - discord
        - liveGames
        - analysisOptOut
        - analysisLeft
      type: object
    ValueCuts:
      additionalProperties: false
      description: Drops of the mover's value, on the scaled range, each above 0 and at most 2, rising
        from inaccuracy to blunder; 0.1, 0.2, and 0.3 suit expected values.
      nullable: true
      properties:
        blunder:
          exclusiveMinimum: true
          maximum: 2
          minimum: 0
          type: number
        inaccuracy:
          exclusiveMinimum: true
          maximum: 2
          minimum: 0
          type: number
        mistake:
          exclusiveMinimum: true
          maximum: 2
          minimum: 0
          type: number
      required:
        - inaccuracy
        - mistake
        - blunder
      type: object
    ValueMeaning:
      description: "What the heuristic, divided by scale, means: expected is the analyzer's estimate of
        x's expected result, 2 P(x wins) - 1; raw is only ordered, higher being better for x, and
        not calibrated."
      enum:
        - expected
        - raw
      type: string
    WatcherLimitError:
      properties:
        code:
          enum:
            - watcher_limit
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: A bot token (hxo_...), minted and rotated by the owner on the website.
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: A game token (hgs_...) from a gameStart line.
      scheme: bearer
      type: http
    sessionCookie:
      description: An HttpOnly session cookie, set by a Discord sign-in, a created account, or the guest
        route; named hexo_arena_session where the site runs without TLS. A write carrying it from
        another origin, by the browser's Sec-Fetch-Site, answers 403 cross_origin.
      in: cookie
      name: __Host-hexo_arena_session
      type: apiKey
    signupCookie:
      description: An HttpOnly cookie for a first sign-in waiting for its public name, set by the Discord
        OAuth callback for 15 minutes.
      in: cookie
      name: hexo_arena_signup
      type: apiKey
info:
  title: HeXO Arena
  version: 0.51.0
openapi: 3.0.3
paths:
  /api/analysis/check:
    post:
      description: "For an engine the browser runs itself: the same refusal a position request meets,
        without asking any analyzer. A caller without a session meets only the position's. One
        client clears 20 at once, then 1 a second, and one IPv6 /48 80 at once, then 4 a second."
      operationId: checkPosition
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionCheck"
        required: true
      responses:
        "204":
          description: No live game stands in the way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionCheckError"
          description: The position is a live game's, or leads on from one (live_position); or the caller sits
            in a live game (seated).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: The client cleared more than 20 at once, then 1 a second, or its IPv6 /48 more than 80
            at once, then 4 a second (rate_limited); or too many requests. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Clear a position against live games.
      tags:
        - Analysis
  /api/analysis/positions:
    post:
      description: Held up to 10 s for a reading by the named analyzer, or any ready one, which reads for
        the asked seconds up to its own most. A kept reading answers at once and costs nothing.
        Refused for a position a live game holds or runs on from, and to a caller seated in a live
        game.
      operationId: requestPositionReading
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionReadingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionReading"
          description: The reading, a place in the queue, or a failure.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
          description: Validation failed, or the position holds two stones on a cell or a six (bad_request).
        "401":
          $ref: "#/components/responses/SignedInUser"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionReadingConflictError"
          description: A live game holds the position, held it a turn or two ago, or leads to it within 10
            turns, under any turn, mirror, color swap, or shift (live_position); the caller sits in
            a live game (seated); no ready analyzer takes it (no_analyzer); or a newer request from
            the caller replaced it (superseded).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionReadingQuotaError"
          description: The caller's 300 positions this UTC day are spent (analysis_limit), until 00:00 UTC,
            which Retry-After names; the analyzers' queues are full (analysis_busy), retry after 10
            s; or a user sent more than 10 at once, then 1 every 2 s (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Ask an analyzer to read a position.
      tags:
        - Analysis
  /api/auth/discord/callback:
    get:
      description: "Requests the identify scope only and keeps the Discord id, username, and display name.
        A known account is signed in unless it is banned. An unknown account creates nothing: the
        callback holds a sign-up for 15 minutes behind the signup cookie and sends the visitor to
        /welcome to choose a public name. A failed sign-in creates no session."
      operationId: discordCallback
      responses:
        "302":
          description: A redirect to the return path with the session cookie set, to /welcome with the signup
            cookie set, or on failure to the return path with signin naming a SignInFailure;
            error=access_denied from Discord reads as cancelled. Codes confirmed with Discord are
            held to 30 at once, then 1 a second across every caller; past that the callback answers
            busy without asking Discord.
          headers:
            Location:
              description: The return path, /welcome, or the return path with signin= and the reason.
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: "Finish Discord OAuth: sign in, or hold a first sign-in."
      tags:
        - Auth
  /api/auth/discord/login:
    get:
      description: Each redirect carries a fresh state and nonce, valid once at the callback, and asks
        Discord to skip its screen for an app the account already allowed. The state keeps the
        return path.
      operationId: discordLogin
      parameters:
        - description: "Where the sign-in returns: a path on this site with its query, at most 256 characters.
            Missing or invalid, the sign-in returns to /."
          in: query
          name: next
          required: false
          schema:
            maxLength: 256
            type: string
      responses:
        "302":
          description: Redirect to Discord's authorize endpoint; or to the return path with
            signin=unconfigured when Discord OAuth is not set up, or with signin=busy past 10 at
            once, then 1 every 30 s per client or 40 at once, then 1 every 7.5 s per IPv6 /48, or
            with 500 sign-ins waiting on Discord.
        "429":
          $ref: "#/components/responses/RateLimited"
      summary: "Start Discord OAuth: redirect to the authorize endpoint."
      tags:
        - Auth
  /api/auth/guest:
    post:
      description: The session lives in server memory only and ends at sign-out, a Discord sign-in, or a
        restart. It also ends after 24 h without a request, unless it sits in a live game. Every
        guest game is unrated, and stays in the public record under the guest's label.
      operationId: startGuest
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: The caller already holds this guest session.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
          description: A new guest session; the session cookie is set.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInError"
          description: A user is signed in.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLimitError"
          description: The global cap of 5000 guest sessions is full (guest_limit), retry after 60 s; or one
            client started 3 at once, then 1 every 20 min, or one IPv6 /48 12 at once, then 1 every
            5 min (rate_limited), or too many requests.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Start an anonymous guest session.
      tags:
        - Auth
  /api/auth/logout:
    post:
      description: "Idempotent: without a live session it still clears the cookie. Ending a guest session
        aborts its live games."
      operationId: logout
      responses:
        "204":
          description: The session is gone and the cookie cleared.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: "Sign out: end the session and clear its cookie."
      tags:
        - Auth
  /api/bot/account:
    get:
      description: The bot's name, rating, and stored declaration; about and repoUrl read as the bot's
        pages show them.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: Each present field replaces the stored one; an empty string clears a text field,
        accepts, levels, and analyzer are replaced whole, and null clears levels or withdraws the
        analyzer. An unknown key answers 400. A challenge or game outside accepts answers
        clock_not_accepted. Levels picked on the website reach the bot as gameStart.level;
        challenges and the weekly tournament play the default.
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeclaration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account after the update.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Declare what the bot accepts, its version, its levels, and its analyzer.
      tags:
        - Account
  /api/bot/analysis/socket:
    get:
      description: "Speaks htttx basic_websocket v1-alpha, the server as client, one position at a time:
        setup with the position's stones, then move_request with previous empty, side,
        move_time_limit, and request_id. The bot answers move_response with move.evaluation and
        considerations up to its declared lines, best first. interrupt drops the outstanding request
        unanswered. Analysis never counts toward the game cap."
      operationId: openAnalysisSession
      parameters:
        - description: The analysis token from the analysisSession line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: "Switching protocols; the analysis session is open, and a new connection replaces the
            previous one. A bot with a live game is sent nothing unless it declared whilePlaying,
            and a game's move request never waits on a reading. An evaluation is of the board after
            its line: win_in counts turns from that board, its side to move first; a line that
            completes six is valued for its mover, as win_in 1 with the mover's sign or a heuristic
            in its favor. A reading fails when the answer comes more than 3 s past move_time_limit,
            a line is no legal turn from the position or repeats one, the move carries no
            evaluation, or an evaluation contradicts the board or passes a win_in of 1000 or a
            heuristic of 1000000 either way. 3 failures within 10 minutes bench the analyzer for 10
            minutes. heartbeat, frame sizes, stray frames, and closes are as on the engine session;
            withdrawing the declaration closes the session."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or replaced analysis token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: The bot no longer declares an analyzer.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A bot dials its analysis session at most 5 at once, then 1 every 10 s (rate_limited),
            or too many requests; a refused dial leaves an open session alone.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security: []
      summary: Open the analysis session.
      tags:
        - Analysis session
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: Only the challenged bot may accept. The game starts at once, and both bots receive gameStart.
      operationId: acceptChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptError"
          description: The challenged bot is at its game cap, or a side is playing the weekly tournament
            (bot_busy); the challenge stays pending.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel; the target receives challengeCanceled.
      operationId: cancelChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Canceled.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline; the challenger receives challengeDeclined.
      operationId: declineChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Declined.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: The target must hold its stream open with open=1 and accept the clock. A bot plays at
        most 4 games at once. The target holds at most 10 pending challenges, 1 from each
        challenger. A challenge expires after 60 s. Resending a requestId answers 200 with the
        stored challenge. Two bots of one owner play each other unrated.
      operationId: createChallenge
      parameters:
        - description: The challenged bot's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The stored challenge for a known requestId, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The challenge, pending in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateError"
          description: Validation failed or the bot challenged itself (bad_request), the target is not open
            (not_open) or excludes the clock (clock_not_accepted), a side is at its game cap or
            playing the weekly tournament (bot_busy), the target's inbox is full (inbox_full), or
            the challenger already has a challenge pending with the target (challenge_pending).
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeForbiddenError"
          description: "Either bot is delisted (delisted), or the challenger's owner is banned (banned).
            own_bot is no longer sent: a challenge between two bots of one owner is played unrated."
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeQuotaError"
          description: Per UTC day a bot sends at most 200 challenges (daily_challenge_cap) and plays at most
            100 rated bot-vs-bot games (daily_bot_cap), and a pair 20 (daily_pair_cap), with
            Retry-After running to 00:00 UTC; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender; no engine session is needed.
      operationId: resignBotGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Resigned.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or rotated game token.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - gameToken: []
      summary: Resign a game with its game token.
      tags:
        - Engine session
  /api/bot/game/{gameId}/socket:
    get:
      description: "Speaks htttx basic_websocket v1-alpha: the bot dials, then answers each move_request
        with a move_response of two cells that echoes its request_id, or the answer is dropped. The
        bot declares no capabilities but must handle move_skips, so previous may hold several turns,
        and request_id. A new connection replaces the previous one. An illegal move forfeits."
      operationId: openEngineSession
      parameters:
        - $ref: "#/components/parameters/GameId"
        - description: The game token from the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: "Switching protocols; the engine session is open. The server first sends setup, whose
            board holds the origin stone alone. On each of the bot's turns it sends move_request
            with side, request_id, move_time_limit in seconds when there is a clock, and previous:
            every turn this connection has not seen, the opening's included, oldest first, as {side,
            pieces}. Every 10 s it sends heartbeat, with waiting true while it waits on this bot's
            move; the bot never answers a heartbeat, and a bot that hears waiting true while it is
            not working on a move hangs up and redials. No frame the server sends exceeds 64 KiB. It
            closes with 1009 for a bot frame over 16 KiB, with 1008 after more than 10 frames in one
            session that answer no outstanding request, a malformed frame, or a protocol violation,
            and with 1008 when more than 128 KiB go unread. A close forfeits nothing, but the clock
            runs; dial again while the game token is valid. A move's evaluation and up to two
            considerations, when present, are published with the finished game."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: Unknown game, or a game token that is expired or rotated.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A seat dials at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused dial leaves an open session alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: One StreamEvent per line, with a bare newline as keepalive every 10 s. Opening a stream
        closes the bot's previous one. The bot is online while its stream is open. On open, each
        active game replays as gameStart, followed on the bot's turn by moveRequest, which is
        deprecated. Play runs on the engine session that gameStart hands out.
      operationId: openStream
      parameters:
        - description: "Present as 1, the bot is open while the stream is: other bots may challenge it, and
            players on the website may start games against it, which arrive as gameStart with no
            challenge. Its owner's games against it, the games of duels and round robins its owner
            set up, and the weekly tournament's games reach it without open=1."
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamEvent"
          description: The event stream, as NDJSON; no line is longer than 64 KiB. The server ends a stream
            that leaves more than 128 KiB unread. A bot whose stream stays closed for 30 s forfeits
            its live games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A bot opens at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused open leaves the open stream alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The listed roster, ordered by name fold, without pagination. Delisted bots and bots of
        banned owners are hidden.
      operationId: listBots
      parameters:
        - description: Present as 1, narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
        - description: Present as 1, narrows the roster to bots that declare an analyzer.
          in: query
          name: analyzer
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BotListing"
                type: array
          description: The roster.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List public bots.
      tags:
        - Directory
    post:
      description: Mints the bot's token; this response is its only appearance. Names share one global
        namespace with users and never change.
      operationId: createBot
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
              required:
                - name
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its token.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotNameError"
          description: The name fails the name syntax or is reserved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLimitError"
          description: The owner already holds 5 bots.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameTakenError"
          description: The name fold is taken by a user or a bot.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Create a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}:
    delete:
      description: "A bot with rated games or a tournament is kept: its games and ratings stay, it reads
        as deleted bot, and its name stays reserved. Any other bot is deleted with its games and its
        name freed."
      operationId: deleteBot
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "204":
          description: The bot and its token are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InGameError"
          description: The bot is seated in a live game.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Delete a bot owned by the session user.
      tags:
        - Bots
  /api/bots/{name}/settings:
    get:
      description: The choices the owner makes for the bot on the website, beside what the bot declares,
        and the client it last connected with. Another person's bot answers not_found.
      operationId: getBotSettings
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
          description: The bot's settings.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Read a bot's settings, as its owner.
      tags:
        - Bots
    patch:
      description: Each present field replaces the stored one; an empty about or repoUrl clears the
        owner's, and the declared one shows again. With duels by others off, the bot leaves every
        running duel and round robin someone else set up, and one left with fewer than two bots is
        cut short.
      operationId: updateBotSettings
      parameters:
        - $ref: "#/components/parameters/BotName"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotSettingsUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
          description: The bot's settings after the change.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Change a bot's settings, as its owner.
      tags:
        - Bots
  /api/bots/{name}/token:
    post:
      description: The previous token stops working at once.
      operationId: rotateBotToken
      parameters:
        - $ref: "#/components/parameters/BotName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotToken"
          description: The bot and its new token, shown only here.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Rotate a bot token.
      tags:
        - Bots
  /api/games:
    get:
      description: Games in progress, newest first, at most 12, without pagination. Guest games are
        listed, tests only when asked; finished games never are. The list is read at most once every
        1 s, and every caller in that time gets the same body.
      operationId: listLiveGames
      parameters:
        - description: Present as 1, tests are listed beside the other games; else they are left out.
          in: query
          name: tests
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LiveGameEntry"
                type: array
          description: The live games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List live games.
      tags:
        - Games
    post:
      description: The bot must hold its stream open with open=1, or at all if it is the caller's own,
        have fewer than 4 live games, and accept the clock. The caller may hold 3 live games, 1 per
        bot. The bot receives gameStart. A guest's game, or one against the caller's own bot, is
        unrated.
      operationId: createGame
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bot:
                  pattern: ^[A-Za-z][A-Za-z0-9_-]{0,28}[A-Za-z0-9]$
                  type: string
                level:
                  description: One of the bot's declared levels, its default when absent; at any other level the game
                    is unrated and counts toward no daily cap.
                  pattern: ^[a-z0-9-]{1,16}$
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 1
                rated:
                  default: true
                  description: False starts a signed-in caller's game unrated for both seats, and it counts toward no
                    daily cap; a guest's game, one against the caller's own bot, or one at a level
                    other than the bot's default, is unrated either way.
                  type: boolean
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - bot
                - timeControl
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The new game's snapshot.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameCreateError"
          description: Validation failed (bad_request), the caller is at its live-game cap (human_busy) or
            already plays this bot (pair_busy), or the bot is not open (not_open), excludes the
            clock (clock_not_accepted), declares no such level (unknown_level), or is at its game
            cap or playing the weekly tournament (bot_busy).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/GameCreateForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLimitError"
          description: The caller started games faster than 3 at once, then 1 a minute (game_cooldown); or a
            signed-in caller has played this bot rated 20 times this UTC day (daily_pair_cap), until
            00:00 UTC; Retry-After says how long either has left; or too many requests
            (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Start a game against a bot.
      tags:
        - Games
  /api/games/finished:
    get:
      description: Finished games, newest first, 20 a page, at most 10 pages per set of filters; before
        reaches older games. Guest games are listed, unrated, under the guest's label. An unknown
        name answers not_found; a deleted player is never a filter. An identical query is read at
        most once every 5 s, every caller then getting one body.
      operationId: listFinishedGames
      parameters:
        - description: A player's name, matched case-folded, in either seat.
          in: query
          name: player
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: The opponent's name; needs player.
          in: query
          name: vs
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: "Who sat: two bots, a signed-in human and a bot, or a guest and a bot."
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bot-bot
              - human-bot
              - guest-bot
            type: string
        - description: won and lost are the player's results and need player; none is a game without a winner.
          in: query
          name: result
          required: false
          schema:
            enum:
              - won
              - lost
              - none
            type: string
        - description: The player's side; needs player.
          in: query
          name: side
          required: false
          schema:
            enum:
              - x
              - o
            type: string
        - description: How the game ended.
          in: query
          name: reason
          required: false
          schema:
            enum:
              - aborted
              - disconnect
              - surrender
              - timeout
              - terminated
              - six-in-a-row
            type: string
        - description: The time control's mode.
          in: query
          name: clock
          required: false
          schema:
            enum:
              - turn
              - match
              - unlimited
            type: string
        - description: Games of a tournament, a duel or round robin among them; or of none.
          in: query
          name: event
          required: false
          schema:
            enum:
              - tournament
              - none
            type: string
        - description: One tournament's games, none for an unknown one; a test's are listed whatever tests
            says, since naming it asks for them.
          in: query
          name: tournament
          required: false
          schema:
            pattern: ^[td]_[a-z0-9]{12}$
            type: string
        - description: One round of the tournament, from 1; needs tournament.
          in: query
          name: round
          required: false
          schema:
            pattern: ^[1-9]\d?$
            type: string
        - description: The opening's plies.
          in: query
          name: opening
          required: false
          schema:
            enum:
              - "1"
              - "3"
              - "5"
              - "7"
              - "9"
            type: string
        - description: Only games finished before this UTC date, YYYY-MM-DD.
          in: query
          name: before
          required: false
          schema:
            format: date
            type: string
        - description: Present as 1, only games a community analyzer has read whole.
          in: query
          name: analyzed
          required: false
          schema:
            enum:
              - "1"
            type: string
        - description: Present as 1, tests are listed and counted beside the other games; else they are left
            out.
          in: query
          name: tests
          required: false
          schema:
            enum:
              - "1"
            type: string
        - description: The page, from 1 to 10; the first when absent.
          in: query
          name: page
          required: false
          schema:
            pattern: ^(?:[1-9]|10)$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishedGamesPage"
          description: One page of games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List finished games.
      tags:
        - Games
  /api/games/{gameId}:
    get:
      description: Board, turn, and clock in one read; a finished game carries its result. Anyone may read
        any game.
      operationId: getGameSnapshot
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The game's snapshot.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/ArchiveLimited"
      security:
        - sessionCookie: []
        - {}
      summary: Read any game.
      tags:
        - Games
  /api/games/{gameId}/analyses:
    get:
      description: "Community readings, with the lines read so far, and each bot seat's own view: the
        evaluation and considerations it sent with its moves. A page polls every 3 s while one is
        queued or running. A game's readings are read at most once every 1 s, every caller then
        getting one body."
      operationId: listAnalyses
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
          description: The readings.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisListConflictError"
          description: The game is live (game_live); its readings open once it ends.
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: Read a finished game's readings.
      tags:
        - Analysis
    post:
      description: A community analyzer reads each position from the first turn after the opening, 2 s
        each. A game holds 2 finished readings from different analyzers and owners, and 1 pending.
        No analyzer reads a game its owner's account or bots played. A request waits 60 minutes for
        an analyzer at most.
      operationId: requestAnalysis
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
        required: false
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityAnalysis"
          description: The request, queued.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedInUser"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRequestConflictError"
          description: The game has a reading pending (analysis_pending) or 2 finished (analysis_full); the
            caller has requests pending at their cap (pending_limit); the game runs past the turn
            cap or holds no turn to read (not_analysable); no analyzer may take it (no_analyzer); a
            player in it opted out (opted_out); or it is live (game_live).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRequestQuotaError"
          description: The caller's 10 requests this UTC day are spent (analysis_limit), until 00:00 UTC,
            which Retry-After names; 50 games wait across the site (analysis_queue_full), retry
            after 60 s; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Ask for a finished game to be read whole.
      tags:
        - Analysis
  /api/games/{gameId}/events:
    get:
      description: "Server-sent events: on open a snapshot, then a turn event per applied turn, then a
        finish event, and the stream closes. A finished game sends its snapshot and closes. A
        comment line comes every 10 s. Events carry no ids and nothing replays: a reconnect gets a
        fresh snapshot."
      operationId: watchGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GameEvent"
          description: The event stream; the server ends one that leaves more than 128 KiB unread.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatcherLimitError"
          description: Watchers without a seat are capped at 200 per game, 1500 in total, and 10 per client,
            and a seat holds at most 4 streams of its own game (watcher_limit), retry after 30 s; or
            a finished game read too often, as on getGameSnapshot, or too many requests
            (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security:
        - sessionCookie: []
        - {}
      summary: Watch a game live.
      tags:
        - Games
  /api/games/{gameId}/move:
    post:
      description: Places both stones of the caller's turn. A win on the first placement ends the game,
        and the second is not applied. An illegal move answers 400 and forfeits nothing.
      operationId: playHumanMove
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cells:
                  items:
                    properties:
                      x:
                        type: integer
                      y:
                        type: integer
                    required:
                      - x
                      - y
                    type: object
                  type: array
              required:
                - cells
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The snapshot after the move.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveError"
          description: Validation failed (bad_request), it is not the caller's turn (not_your_turn), a cell is
            taken (cell_occupied) or out of range (out_of_range), or the game is over (game_over).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Play the two placements of the caller's turn.
      tags:
        - Games
  /api/games/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender.
      operationId: resignHumanGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSnapshot"
          description: The finished snapshot.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Resign a game the caller plays in.
      tags:
        - Games
  /api/leaderboard:
    get:
      description: Rankable players, highest rating first, ties by name fold, at most 500. A player is
        rankable at a rating deviation of 75 or below. Banned users, delisted bots, and bots of
        banned owners never appear. Bots and humans share one rating pool.
      operationId: getLeaderboard
      parameters:
        - description: Narrows the board to bots or humans; all when absent.
          in: query
          name: kind
          required: false
          schema:
            enum:
              - bots
              - humans
              - all
            type: string
        - description: Players whose latest rated game finished in the last 30 days, or all; 30 days when
            absent.
          in: query
          name: active
          required: false
          schema:
            enum:
              - 30d
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
                maxItems: 500
                type: array
          description: The board.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List rankable players by rating.
      tags:
        - Directory
  /api/me:
    delete:
      description: The body names the account's public name. The account, its sessions, and its bots are
        deleted, and its name is freed; its games stay, the account reading as deleted player and
        each kept bot as deleted bot. Its bots' live games are aborted and their tournament entries
        withdrawn. Every session ends and the cookie clears.
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "204":
          description: The account is gone and the cookie cleared.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameMismatchError"
          description: Validation failed (bad_request), or the name is not the account's (name_mismatch).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InLiveGameError"
          description: The account is seated in a live game (in_live_game); it finishes or resigns first.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Delete the signed-in account.
      tags:
        - Auth
    get:
      description: Reads the session cookie alone; without a live session the answer is null, never 401.
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/Guest"
                  - nullable: true
          description: The session's user or guest, or null.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: Who the session names.
      tags:
        - Auth
    patch:
      description: Each present field replaces the stored one. While a user is opted out, requests to read
        their games are refused; positions on the analysis board stay readable.
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: The user after the change.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedInUser"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Change the signed-in user's settings.
      tags:
        - Auth
  /api/me/export:
    get:
      description: Every row tied to the account as one JSON attachment. An account downloads 2 at once,
        then 1 every 10 min.
      operationId: exportAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
          description: The account's data.
          headers:
            Content-Disposition:
              description: An attachment named for the account and the day.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Download the signed-in account's data.
      tags:
        - Auth
  /api/players/{name}:
    get:
      description: Games won, lost, and without a winner, by side, forfeits, the most played opponents,
        and a bot's tournament places. A name no player holds answers not_found. A record is read at
        most once every 5 s, every caller in that time getting the same body.
      operationId: getPlayerRecord
      parameters:
        - $ref: "#/components/parameters/PlayerName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRecord"
          description: The record.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: Read a player's record.
      tags:
        - Players
  /api/players/{name}/rating:
    get:
      description: The rating after each rated game in the range, the newest 500 at most. A name no player
        holds answers not_found.
      operationId: getRatingHistory
      parameters:
        - $ref: "#/components/parameters/PlayerName"
        - description: "How far back: 30 days, a year, or all; a year when absent."
          in: query
          name: range
          required: false
          schema:
            default: 1y
            enum:
              - 30d
              - 1y
              - all
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingHistory"
          description: The history.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: Read a player's rating history.
      tags:
        - Players
  /api/reports:
    post:
      description: Anyone may report, signed in or not; the report is stored for the operator, who closes
        it with a note. One client sends 5 at once, then 1 every 10 min, one IPv6 /48 20 at once,
        then 1 every 150 s, and every caller together 30 at once, then 1 a minute.
      operationId: createReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
          description: The report is stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: Report something on the site to the operator.
      tags:
        - Reports
  /api/signup:
    delete:
      description: "Idempotent: deletes whatever the cookie holds and clears the cookie."
      operationId: cancelSignup
      responses:
        "204":
          description: Nothing of the sign-up is kept.
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
        - {}
      summary: Drop the first sign-in without creating the account.
      tags:
        - Auth
    get:
      description: The Discord account the sign-in came from, names up to 32 characters, a name made from
        its username that is free at the time of the read, and where the sign-in returns once the
        account exists.
      operationId: getSignup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signup"
          description: The waiting sign-up.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupExpiredError"
          description: "No sign-up waits for this cookie: it expired, was used, or never existed."
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
      summary: Read the first sign-in waiting for its public name.
      tags:
        - Auth
    post:
      description: Creates the account and its session, ends whatever session the browser held, a guest's
        with its games, and clears the signup cookie. The name shares one global namespace with bots
        and never changes. A sign-up takes at most 10 names; past that it ends.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupCreated"
          description: The account exists; the session cookie is set.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupNameError"
          description: The chosen public name fails the name syntax or is reserved.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupTakenError"
          description: Another user or a bot holds the chosen name's fold.
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEndedError"
          description: No sign-up waits for this cookie (signup_expired), or it tried 10 names and has ended
            (signup_limit); signing in again starts a new one.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - signupCookie: []
      summary: Create the account under the chosen public name.
      tags:
        - Auth
  /api/tournaments:
    get:
      description: "Up to 20 running, 3 waiting, and the latest 20 over: every one, one bot's, an unknown
        bot answering not_found, the caller's, or tests. For a signed-in caller, the list of every
        bot names under yours their bot in each, and its place. A duel's summary carries its pair
        for its score cells."
      operationId: listTournaments
      parameters:
        - description: "A bot's name, matched case-folded: only the tournaments it entered, each with its
            place."
          in: query
          name: bot
          required: false
          schema:
            maxLength: 30
            minLength: 1
            type: string
        - description: Present as 1, only the tournaments the signed-in caller set up and those one of their
            bots plays; none for a caller signed out.
          in: query
          name: mine
          required: false
          schema:
            enum:
              - "1"
            type: string
        - description: Only tests, duels and round robins of one person's bots.
          in: query
          name: kind
          required: false
          schema:
            enum:
              - test
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentList"
          description: The tournaments.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
        - {}
      summary: List tournaments.
      tags:
        - Tournaments
    post:
      description: "The picked bots start at once, never rated: two play a duel, three or more a round
        robin, a round's pairs at once. One person's bots alone make a test. A person runs 2 at once
        and sets up 10 a UTC day; a bot plays in 2 at once, at most 30 games in one, 70 in a test."
      operationId: createTournament
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
          description: The new duel or round robin.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCreateError"
          description: Validation failed (bad_request); a bot is not open (not_open), though the caller's own
            bot need not be, takes no duels or round robins from others (duel_refused), excludes the
            clock (clock_not_accepted), declares no such level (unknown_level), or is busy
            (bot_busy); more than 10 games a pair outside a test (test_only); a bot past its most
            games (too_many_games); or the caller runs 2 already (tournament_busy).
        "401":
          $ref: "#/components/responses/SignedInUser"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCreateForbiddenError"
          description: A picked bot is delisted (delisted), or its owner is banned (banned).
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentQuotaError"
          description: The caller set up 10 duels and round robins this UTC day (daily_tournament_cap), until
            00:00 UTC, which Retry-After names; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - sessionCookie: []
      summary: Set up a duel or a round robin of bots.
      tags:
        - Tournaments
  /api/tournaments/bots:
    get:
      description: Every listed bot, as the bot list orders it, with its owner's switch for duels by
        others and the running duels and round robins people set up that it plays in. Read at most
        once every 2 s, every caller in that time getting the same body.
      operationId: listTournamentBots
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentBotStates"
          description: The listed bots' tournament states.
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: Read the bots' tournament states.
      tags:
        - Tournaments
  /api/tournaments/{id}:
    get:
      description: Its entries, rounds, standings, live games, the bots games wait for, and a test's
        estimates. A game waits 60 s for a bot not ready, then scores a no-show; a person's is cut
        short once fewer than two bots play. A tournament is read at most once every 2 s, every
        caller in that time getting the same body.
      operationId: getTournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
          description: The tournament.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: Read a tournament.
      tags:
        - Tournaments
  /api/tournaments/{id}/entry:
    delete:
      description: While the tournament waits; without an entry nothing changes.
      operationId: withdrawTournamentEntry
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "204":
          description: No bot of the caller is entered.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentClosedError"
          description: The tournament no longer waits (closed).
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Withdraw the caller's entry.
      tags:
        - Tournaments
    put:
      description: While the tournament waits, its owner enters one bot, replacing any bot the owner
        entered before. From the start to the end an entrant takes no other new game, and challenges
        to or from it answer bot_busy.
      operationId: enterTournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentEntryRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentEntry"
          description: The entry.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentEntryError"
          description: Validation failed (bad_request), or the bot does not accept the clock
            (clock_not_accepted).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentForbiddenError"
          description: The bot is someone else's (not_owner), or it is delisted (delisted).
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentClosedError"
          description: The tournament no longer waits (closed), or holds its most entries (full).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Enter a bot, or replace the entered one.
      tags:
        - Tournaments
  /api/tournaments/{id}/export:
    get:
      description: Every game over so far, at most 280, numbered in the order played, any game under way
        left out; games.csv names each game's round, and standings.csv holds the standings as they
        stand.
      operationId: exportTournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          $ref: "#/components/responses/GameExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/ExportLimited"
      security: []
      summary: Download a tournament's games.
      tags:
        - Tournaments
  /api/tournaments/{id}/stop:
    post:
      description: "The person who set a duel or round robin up stops it while it runs: no further game
        starts, the live ones play on to their results, and the standings stand."
      operationId: stopTournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
          description: The tournament, stopped.
        "401":
          $ref: "#/components/responses/SignedInUser"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStopForbiddenError"
          description: The caller did not set it up (not_yours).
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStopConflictError"
          description: It is already over (over).
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Stop a duel or round robin.
      tags:
        - Tournaments
  /api/tournaments/{id}/withdraw:
    post:
      description: "A bot's owner takes it out of a running duel or round robin a person set up: its live
        game plays on, and its games still to come score for its opponents. Leaving fewer than two
        bots to play, as in a duel, cuts it short. The operator's weekly answers not_found."
      operationId: withdrawFromTournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentWithdrawRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
          description: The tournament, the bot withdrawn.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignedInUser"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentWithdrawForbiddenError"
          description: The caller does not own the bot (not_owner).
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentWithdrawConflictError"
          description: "The tournament is over (over), or the bot plays no further game in it: never in its
            field, or withdrawn already (not_playing)."
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - sessionCookie: []
      summary: Withdraw a bot from a duel or round robin.
      tags:
        - Tournaments
  /healthz:
    get:
      responses:
        "200":
          description: The process is up and serving.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The process is up and paused.
      summary: Liveness probe.
