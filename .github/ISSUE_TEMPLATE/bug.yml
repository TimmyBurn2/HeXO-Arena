name: Bug report
description: Something on the site or in its code does not work as it should.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Issues are public: leave out personal data, tokens, and passwords.
              A privacy or data request goes to the operator, at the contact in the site's privacy policy.
    - type: textarea
      id: happened
      attributes:
          label: What happened
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What you expected
      validations:
          required: true
    - type: input
      id: page
      attributes:
          label: Page or link
          description: Where it happened, such as the address of a game or a bot.
    - type: textarea
      id: steps
      attributes:
          label: Steps
          description: What you did before it happened, one step per line.
          placeholder: |
              1.
              2.
              3.
    - type: input
      id: browser
      attributes:
          label: Browser and device
          placeholder: Firefox 131 on Android
