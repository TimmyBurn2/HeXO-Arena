name: ci
on:
    push:
    pull_request:
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm build
            - run: pnpm openapi
            - run: git diff --exit-code openapi.yaml
    # Every run builds the image, so a broken Dockerfile fails review; only
    # main pushes it.
    # The box never builds, it only pulls.
    image:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v5
            - uses: docker/setup-buildx-action@v3
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  # Named for the site, whatever the repository is called.
                  images: ghcr.io/${{ github.repository_owner }}/hexo-arena
                  tags: |
                      type=sha,format=long
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            - uses: docker/login-action@v3
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/prod/Dockerfile
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
