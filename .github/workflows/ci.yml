name: ci
on:
    push:
    pull_request:
    # A fork receives no push until it makes one; a run started by hand on
    # main publishes its first image.
    workflow_dispatch:
# Every job reads the repository and nothing more unless it says so.
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            - run: pnpm build
            - run: pnpm openapi
            - run: git diff --exit-code openapi.yaml
    # Every run builds the image, so a broken Dockerfile fails review; only
    # main pushes it, on a push or a run started by hand.
    # The box never builds, it only pulls.
    image:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              id: meta
              with:
                  # Named for the site, whatever the repository is called.
                  images: ghcr.io/${{ github.repository_owner }}/hexo-arena
                  tags: |
                      type=sha,format=long
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/prod/Dockerfile
                  push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
